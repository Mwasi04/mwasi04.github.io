    <button class="btn" onclick="closeModal(); posFind.brand=modelById('${id}').brandId; posFind.model='${id}'; go('dashboard')">Sell Parts for This Model</button></div>`);
}

/* ============================================================
   RECORDS  (Sales + Stock Entry) — one clean panel, like the reference
   ============================================================ */
let recTab = 'sales';
function setRecTab(t){ recTab = t; renderRecords(); }

function salesRows(){
  const st = STATE.sales, q = st.q.toLowerCase().trim(), r = rangeOf(st), rows = [];
  db.sales.forEach(s => {
    if(!inRange(s.date, r) || (st.pay && s.payment !== st.pay)) return;
    s.items.forEach((i, n) => {
      if(q && ![s.id, s.customer, s.payment, s.by, i.name, i.sku].join(' ').toLowerCase().includes(q)) return;
      rows.push({key:s.id + '-' + n, s, i});
    });
  });
  return rows.reverse();
}
function stockRows(){
  const st = STATE.stock, q = st.q.toLowerCase().trim(), r = rangeOf(st);
  return db.movements.filter(m => m.type !== 'Sale' && inRange(m.date, r) && (!st.type || m.type === st.type) &&
    (!q || [m.name, m.sku, m.type, m.ref, m.by].join(' ').toLowerCase().includes(q))).reverse();
}

// Dropdown-style button (white, bordered, with a caret)
const CARET = '<svg viewBox="0 0 24 24" class="caret"><path d="M6 9l6 6 6-6"/></svg>';
function ddButton(label, onclick, on){ return `<button class="dd ${on?'on':''}" onclick="${onclick}">${esc(label)}${CARET}</button>`; }

function renderRecords(){
  const isSales = recTab === 'sales', key = isSales ? 'sales' : 'stock', st = STATE[key];
  const filterLabel = isSales ? (st.pay || 'All payments') : (st.type || 'All types');
  $('#app').innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <h2>${isSales ? 'Sales Details' : 'Stock Entry Details'}</h2>
        <div class="panel-tools">
          <div class="search">${ICON.search}<input id="q_${key}" placeholder="search" value="${esc(st.q)}"></div>
          ${ddButton(isSales ? 'Sales' : 'Stock Entry', 'recTypeMenu(event)')}
          ${ddButton(st.range === 'all' ? 'All dates' : DATE_LABELS[st.range], `dateMenu(event,'${key}')`, st.range !== 'all')}
          ${ddButton(filterLabel, `recFilterMenu(event,'${key}')`, isSales ? !!st.pay : !!st.type)}
          <button class="icon-btn" title="Export (copies CSV)" onclick="${isSales ? 'exportSales' : 'exportStock'}()">${ICON.export}</button>
        </div>
      </div>
      <div class="table-wrap" id="tb_${key}"></div>
      <div id="tf_${key}"></div>
    </div>`;
  bindSearch(key);
  drawTable(key);
}
function recTypeMenu(e){
  openMenu(e, [{title:'Show'},
    {label:'Sales', active: recTab==='sales', fn:()=>setRecTab('sales')},
    {label:'Stock Entry', active: recTab==='stock', fn:()=>setRecTab('stock')}]);
}
function recFilterMenu(e, key){
  const st = STATE[key];
  const opts = key === 'sales' ? PAYMENTS : ['Opening stock','Restock','Adjustment'];
  const field = key === 'sales' ? 'pay' : 'type';
  openMenu(e, [{title: key === 'sales' ? 'Payment method' : 'Entry type'},
    {label: key === 'sales' ? 'All payments' : 'All types', active: !st[field], fn:()=>{ st[field] = ''; st.page = 1; renderRecords(); }},
    ...opts.map(o => ({label:o, active: st[field] === o, fn:()=>{ st[field] = o; st.page = 1; renderRecords(); }}))]);
}

// Round avatar with initials (colour picked from the name)
const AV_COLORS = ['#c01c2c','#16181f','#e8871e','#1f9d55','#7c4dcc','#2b6cb0','#b83280','#0f766e'];
function initials(name){ return String(name).trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase() || '?'; }
function avColor(name){ let h = 0; for(const c of String(name)) h = (h*31 + c.charCodeAt(0)) >>> 0; return AV_COLORS[h % AV_COLORS.length]; }
function who(name, opts={}){
  if(!name) return `<span class="who"><span class="av av-empty">${ICON.user}</span><span class="muted-name">${esc(opts.empty || 'Walk-in')}</span></span>`;
  return `<span class="who"><span class="av ${opts.square?'sq':''}" style="background:${avColor(name)}">${esc(initials(name))}</span>${opts.html || esc(name)}</span>`;
}

/* ============================================================
   EXPENSES  (record and manage costs)
   ============================================================ */
function expenseRows(){
  const st = STATE.exp, q = st.q.toLowerCase().trim(), r = rangeOf(st);
  return db.expenses.filter(e => inRange(e.date + 'T12:00:00', r) && (!st.cat || e.category === st.cat) &&
    (!q || [e.description, e.category, e.by].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
}
const expInRange = r => db.expenses.filter(e => inRange(e.date + 'T12:00:00', r));

function renderExpenses(){
  const st = STATE.exp, r = rangeOf(st), list = expInRange(r);
  const total = list.reduce((a,e)=>a+e.amount,0);
  const pr = prevRangeOf(st), prevTotal = pr ? expInRange(pr).reduce((a,e)=>a+e.amount,0) : 0;
  const byCat = {}; list.forEach(e => byCat[e.category] = (byCat[e.category]||0) + e.amount);
  const topCat = Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  $('#app').innerHTML = `
    <div class="page-head">
      <button class="btn  icon" onclick="expenseForm()" data-tip="Add Expense" aria-label="Add Expense">${ICON.plus}</button></div>
    ${summaryCards([
      {title:'Total Expenses', color:'blue', value:money(total), period:periodName(st.range), trend: pr && {cur:total, prev:prevTotal, label:pr.label, goodUp:false}},
      {title:'Expense Entries', color:'orange', value:String(list.length), period:periodName(st.range)},
      {title:'Top Category', color:'red', value: topCat ? esc(topCat[0]) : '—', period: topCat ? money(topCat[1]) : 'No expenses yet'}
    ])}
    ${tableCard({
      title:'All Expenses', key:'exp', placeholder:'Search expenses', date:true, exportFn:'exportExpenses',
      filter:`<div><label>Category</label><select id="f_cat"><option value="">All</option>

/* ============================================================
   ANALYTICS  (view only: income, costs, expenses, profit)
   ============================================================ */
function renderAnalytics(){
  const st = STATE.ana, r = rangeOf(st), periodLabel = periodName(st.range);
  const sales = db.sales.filter(s => inRange(s.date, r));
  const allExp = expInRange(r);
  const revenue = sales.reduce((a,s)=>a+saleNet(s),0);
  const vatCollected = sales.reduce((a,s)=>a+(s.vat||0),0);
  const cogs = sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+itemCost(i)*i.qty,0),0);
  const gross = revenue - cogs;
  const expTotal = allExp.reduce((a,e)=>a+e.amount,0);
  const net = gross - expTotal;
  // same figures for the previous period, for the trend pills
  const pr = prevRangeOf(st), p = {};
  if(pr){
    const ps = db.sales.filter(s => inRange(s.date, pr));
    p.revenue = ps.reduce((a,s)=>a+saleNet(s),0);
    p.expTotal = expInRange(pr).reduce((a,e)=>a+e.amount,0);
    p.net = p.revenue - ps.reduce((a,s)=>a+s.items.reduce((b,i)=>b+itemCost(i)*i.qty,0),0) - p.expTotal;
  }

  const byPay = {}; sales.forEach(s => byPay[s.payment] = (byPay[s.payment]||0) + s.total);
  const payTotal = Object.values(byPay).reduce((a,b)=>a+b,0);
  const byCat = {}; allExp.forEach(e => byCat[e.category] = (byCat[e.category]||0) + e.amount);
  const bars = (obj, total, colorOf) => Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `
    <div class="bar-row"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><span style="color:var(--ink);font-weight:500">${money(v)}</span></div>
    <div class="bar"><div style="width:${total ? (v/total*100).toFixed(1) : 0}%;background:var(--${colorOf(k)})"></div></div></div>`).join('');
  const missingCost = db.parts.some(p => !p.cost);

  $('#app').innerHTML = `
    <div class="page-head">
      ${ddButton(periodLabel, "dateMenu(event,'ana')", st.range !== 'all')}</div>
    ${missingCost ? '<div class="note">Some parts have no cost price, so their cost counts as zero. Add cost prices in Inventory for accurate profit.</div>' : ''}
    ${summaryCards([
      {title:'Sales Income', color:'blue', value:money(revenue), period:periodLabel, trend: pr && {cur:revenue, prev:p.revenue, label:pr.label}},
      {title:'Expenses', color:'orange', value:money(expTotal), period:periodLabel, trend: pr && {cur:expTotal, prev:p.expTotal, label:pr.label, goodUp:false}},
      {title:'Net Profit', color: net >= 0 ? 'green' : 'loss', value:money(net), period:periodLabel, trend: pr && {cur:net, prev:p.net, label:pr.label}}
    ])}
    <div class="acc-grid">
      <div class="card"><div class="card-head"><h3>Profit &amp; Loss</h3></div><div class="card-body">
        <div class="pl-row"><span>Sales income${vatCollected ? ' (excl. VAT)' : ''}</span><span>${money(revenue)}</span></div>
        <div class="pl-row"><span>Cost of parts sold</span><span>− ${money(cogs)}</span></div>
        <div class="pl-row total-row"><span>Gross profit</span><span>${money(gross)}</span></div>
        <div class="pl-row"><span>Expenses</span><span>− ${money(expTotal)}</span></div>
        <div class="pl-row total-row"><span>Net profit</span><span class="c-${net>=0?'green':'red'}">${money(net)}</span></div>
        ${vatCollected ? `<div class="pl-row"><span>VAT collected (owed to tax authority)</span><span>${money(vatCollected)}</span></div>` : ''}
      </div></div>
      <div class="card"><div class="card-head"><h3>Income by Payment</h3></div><div class="card-body">
        ${Object.keys(byPay).length ? bars(byPay, payTotal, payColor) : emptyState('cart','No sales in this period')}</div></div>
      <div class="card"><div class="card-head"><h3>Expenses by Category</h3></div><div class="card-body">
        ${Object.keys(byCat).length ? bars(byCat, expTotal, catColor) : emptyState('wallet','No expenses in this period')}</div></div>
    </div>
    <div class="card" id="chartBox"></div>
    <div class="card"><div class="card-head"><h3>Top Selling Parts</h3><span class="sub">${esc(periodLabel)}</span></div><div style="height:16px"></div>
      <div class="table-wrap" id="tb_top"></div><div id="tf_top"></div></div>`;
  drawTable('top'); drawSalesChart();
}
function topParts(){
  const r = rangeOf(STATE.ana), map = {};
  db.sales.filter(s => inRange(s.date, r)).forEach(s => s.items.forEach(i => {
    const m = map[i.partId] || (map[i.partId] = {id:i.partId, name:i.name, sku:i.sku, units:0, revenue:0, profit:0});
    m.units += i.qty; m.revenue += i.price*i.qty; m.profit += (i.price - itemCost(i))*i.qty;
  }));
  return Object.values(map).sort((a,b)=>b.revenue-a.revenue).map((x,n) => (x.rank = n+1, x));
}

// Resize an uploaded image so it fits comfortably in browser storage
function shrinkImage(file, max){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ============================================================
   SIGN-IN, USERS & ROLES
   Note: sign-in runs in the browser only — real security needs a server.
   ============================================================ */
const SESSION_KEY = 'hardware_pm_session';
let currentUser = null;
const isAdmin = () => !!currentUser && currentUser.role === 'admin';

async function hashPass(pw){
  const data = new TextEncoder().encode('leiden:' + pw);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}
function getSession(){ try{ return localStorage.getItem(SESSION_KEY); }catch(e){ return sessionMemory; } }
function setSession(id){ sessionMemory = id; try{ id ? localStorage.setItem(SESSION_KEY, id) : localStorage.removeItem(SESSION_KEY); }catch(e){} }
let sessionMemory = null;

function showLogin(){
  currentUser = null;
  $('#appShell').style.display = 'none';
  $('#login').style.display = '';
  $('#loginLogo').src = shopLogo();
  $('#lgError').textContent = '';
  $('#lgPass').value = '';
  setTimeout(() => $('#lgEmail').focus(), 50);
}
function showApp(){
  $('#login').style.display = 'none';
  $('#appShell').style.display = '';
  currentView = '';
  route();
}
$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const email = $('#lgEmail').value.trim().toLowerCase(), pw = $('#lgPass').value;
  const user = db.users.find(u => u.email.toLowerCase() === email);
  let ok = false;
  try{ ok = !!user && (await hashPass(pw)) === user.passHash; }
  catch(err){ $('#lgError').textContent = 'Sign-in needs a secure (https) page.'; return; }
  if(!ok){ $('#lgError').textContent = 'Incorrect email or password.'; $('#lgPass').select(); return; }
  currentUser = user; setSession(user.id);
  if(location.hash === '#settings' && !isAdmin()) location.replace('#dashboard');
  showApp();
  toast('Welcome, ' + user.name.split(' ')[0]);
};
function logout(){
  setSession(null); cart = []; sale = {pay:'Cash', received:'', customer:'', phone:'', showCustomer:false}; saveCart();
  Object.values(STATE).forEach(s => s.sel.clear());
  closeModal(); showLogin();
}

const adminCount = () => db.users.filter(u => u.role === 'admin').length;
function userForm(id){
  const u = id ? db.users.find(x => x.id === id) : {name:'', email:'', role:'staff'};
  const self = id === currentUser.id;
  openModal(`<h3>${id ? 'Edit user' : 'Add user'}</h3>
    <form id="f">
      <div class="field"><label>Full name</label><input name="name" required value="${esc(u.name)}" placeholder="e.g. Mary Banda"></div>
      <div class="field"><label>Email</label><input name="email" type="email" required value="${esc(u.email)}" placeholder="name@example.com"></div>
      <div class="field"><label>Role</label><select name="role" ${self?'disabled':''}>
        <option value="staff" ${u.role==='staff'?'selected':''}>Staff — sales, inventory, records, expenses, analytics</option>
        <option value="admin" ${u.role==='admin'?'selected':''}>Administrator — everything, including Settings and users</option></select>
        ${self ? '<div class="hint">You can’t change your own role.</div>' : ''}</div>
      ${id ? '' : `<div class="field"><label>Password</label><input name="pw" type="password" required minlength="6" placeholder="At least 6 characters"></div>`}
      <div class="login-error" id="ufErr"></div>
      <div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">${id ? 'Save Changes' : 'Create User'}</button></div>
    </form>`);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const f = e.target, email = f.email.value.trim().toLowerCase(), name = f.name.value.trim();
    const role = self ? u.role : f.role.value;
    if(db.users.some(x => x.email.toLowerCase() === email && x.id !== id)){ $('#ufErr').textContent = 'A user with this email already exists.'; return; }
    if(id && u.role === 'admin' && role !== 'admin' && adminCount() <= 1){ $('#ufErr').textContent = 'There must be at least one administrator.'; return; }
    if(id){ Object.assign(u, {name, email, role}); }
    else {
      const pw = f.pw.value;
      if(pw.length < 6){ $('#ufErr').textContent = 'Password must be at least 6 characters.'; return; }
      db.users.push({id:newId('u'), name, email, role, created:new Date().toISOString(), passHash: await hashPass(pw)});
    }
    save(); closeModal(); toast(id ? 'User updated' : 'User created'); route();
  };
}
function passwordForm(id){
  const u = db.users.find(x => x.id === id);
  openModal(`<h3>Reset password</h3><p class="sub" style="margin:-8px 0 16px">For ${esc(u.name)} (${esc(u.email)})</p>
    <form id="f">
      <div class="field"><label>New password</label><input name="pw" type="password" required minlength="6" placeholder="At least 6 characters"></div>
      <div class="field"><label>Confirm new password</label><input name="pw2" type="password" required minlength="6"></div>
      <div class="login-error" id="ufErr"></div>
      <div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">Save Password</button></div>
    </form>`);
  $('#f').onsubmit = async e => {
    e.preventDefault();
    const f = e.target;
    if(f.pw.value.length < 6){ $('#ufErr').textContent = 'Password must be at least 6 characters.'; return; }
    if(f.pw.value !== f.pw2.value){ $('#ufErr').textContent = 'The passwords don’t match.'; return; }
    u.passHash = await hashPass(f.pw.value);
    save(); closeModal(); toast('Password updated');
  };
}
function deleteUser(id){
  const u = db.users.find(x => x.id === id);
  if(u.role === 'admin' && adminCount() <= 1) return toast('There must be at least one administrator');
  confirmBox(`Delete ${u.name}? They will no longer be able to sign in.`, () => {
    db.users = db.users.filter(x => x.id !== id);
    save(); toast('User deleted'); route();
  });
}

/* ---------- Start ---------- */
(function boot(){
  const id = getSession();
  currentUser = db.users.find(u => u.id === id) || null;
  if(currentUser) showApp(); else showLogin();
})();
</script>
