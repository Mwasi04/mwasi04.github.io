<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hardware Parts Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6fa; --card:#fff; --ink:#1f2433; --text:#3d4354; --muted:#8a90a2; --line:#eceef3; --line2:#e2e5ec;
    --primary:#5b5ff0; --primary-dark:#4a4ed8; --primary-soft:#eef0ff;
    --blue:#2f7cf6; --orange:#f2994a; --red:#e5484d; --green:#27a35a; --purple:#9b51e0;
    --radius:10px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
  svg.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Layout ---------- */
  .layout{display:flex;min-height:100vh}
  aside{width:240px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
  .logo{display:flex;align-items:center;gap:10px;padding:24px 24px 28px;font-weight:600;font-size:18px;color:var(--ink);overflow:hidden}
  .logo .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logo-mark{width:32px;height:32px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;flex-shrink:0;overflow:hidden}
  .logo-mark svg{width:17px;height:17px;stroke:#fff}
  .logo-mark img{width:100%;height:100%;object-fit:cover;background:#fff}
  .side-nav{padding:0 18px;display:flex;flex-direction:column;gap:4px;flex:1}
  .side-nav a{display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;padding:11px 14px;border-radius:8px;font-weight:500;font-size:14px}
  .side-nav a:hover{background:#f4f5fb}
  .side-nav a.active{background:var(--primary);color:#fff}
  .side-nav .spacer{flex:1}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:66px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:15;gap:12px}
  .topbar h1{font-size:18px;font-weight:500;color:var(--ink);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tb-right{display:flex;align-items:center;gap:16px}
  .date-pill{display:flex;align-items:center;gap:8px;background:#fff8ec;border:1px solid #f6e3c3;color:var(--ink);padding:7px 12px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap}
  .date-pill svg{width:15px;height:15px;color:var(--orange)}
  .bell{position:relative;background:none;border:none;color:var(--primary);padding:4px;cursor:pointer;display:flex}
  .bell svg{width:20px;height:20px}
  .bell .dot{position:absolute;top:2px;right:3px;width:8px;height:8px;background:var(--red);border-radius:50%;border:2px solid #fff}
  .avatar{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#ff8a65,#e5484d);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;cursor:pointer}
  .crumbs{background:#fff;border-bottom:1px solid var(--line);padding:10px 28px;font-size:12px;color:var(--muted)}
  .crumbs b{color:var(--ink);font-weight:500}
  .crumbs a{color:var(--muted);text-decoration:none} .crumbs a:hover{color:var(--primary)}
  .crumbs span{margin:0 8px}
  .content{padding:26px 28px 60px}
  .inner{max-width:1220px;margin:0 auto}

  /* ---------- Page header & summary cards ---------- */
  .page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .page-head h2{flex:1;margin:0;font-size:22px;font-weight:500;color:var(--ink);min-width:200px}
  .summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:20px}
  .s-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
  .s-card.click{cursor:pointer} .s-card.click:hover{border-color:var(--line2);box-shadow:0 2px 10px rgba(30,40,80,.05)}
  .s-card .t{font-size:21px;font-weight:500;margin-bottom:16px}
  .s-card .b{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .s-card .v{font-size:15px;color:var(--text);font-weight:500}
  .s-card .p{font-size:13px;color:var(--muted)}
  .c-blue{color:var(--blue)} .c-orange{color:var(--orange)} .c-red{color:var(--red)} .c-green{color:var(--green)} .c-purple{color:var(--purple)}

  /* ---------- Cards, toolbars, buttons ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:20px}
  .card-head{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-head h3{margin:0;font-size:16px;font-weight:500;color:var(--ink)}
  .card-body{padding:16px 20px 20px}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px}
  .toolbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .search{position:relative;width:300px;max-width:100%}
  .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
  .search input{padding-left:34px}
  .filter-panel{display:none;gap:12px;flex-wrap:wrap;padding:0 20px 14px;align-items:flex-end}
  .filter-panel.open{display:flex}
  .filter-panel > div{min-width:170px}

  input,select,textarea{font:inherit;font-size:13px;padding:8px 11px;border:1px solid var(--line2);border-radius:7px;background:#fff;color:var(--ink);width:100%}
  textarea{resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
  input[type=checkbox]{width:15px;height:15px;accent-color:var(--primary);cursor:pointer;padding:0}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:500}
  .field{margin-bottom:14px}
  .hint{font-size:12px;color:var(--muted);margin-top:5px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}

  .btn{font:inherit;font-size:13px;cursor:pointer;border:1px solid transparent;border-radius:7px;padding:8px 14px;font-weight:500;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;text-decoration:none}
  .btn svg{width:15px;height:15px}
  .btn:hover{background:var(--primary-dark)}
  .btn.lg{padding:10px 18px}
  .btn.outline{background:#fff;color:var(--ink);border-color:var(--line2)}
  .btn.outline:hover{background:#f7f8fb}
  .btn.outline.on{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
  .btn.soft{background:var(--primary-soft);color:var(--primary)}
  .btn.soft:hover{background:#e2e5ff}
  .btn.danger{background:#fdecec;color:var(--red)}
  .btn.danger:hover{background:#fadada}
  .btn.sm{padding:5px 11px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .tabs{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px;gap:4px;margin-bottom:20px}
  .tabs button{font:inherit;font-size:13px;font-weight:500;border:none;background:none;color:var(--muted);padding:7px 16px;border-radius:6px;cursor:pointer}
  .tabs button.active{background:var(--primary-soft);color:var(--primary)}

  /* ---------- Tables ---------- */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:14px 12px;white-space:nowrap;vertical-align:middle;font-size:13px}
  th{background:#f8f9fb;color:var(--muted);font-weight:500;font-size:12.5px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);user-select:none}
  th.sortable{cursor:pointer} th.sortable:hover{color:var(--ink)}
  th .arrow{display:inline-block;width:10px;margin-left:4px;font-size:10px;color:var(--line2)}
  th.sorted{color:var(--ink)} th.sorted .arrow{color:var(--primary)}
  td{color:var(--text);border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#fafbfd}
  tr.sel td{background:#f6f7ff}
  th.cb,td.cb{width:40px;padding-right:0}
  th:first-child,td:first-child{padding-left:20px}
  th:last-child,td:last-child{padding-right:20px}
  td.num,th.num{text-align:right}
  td.strong{color:var(--ink);font-weight:500}
  td a{color:var(--ink);text-decoration:none;font-weight:500} td a:hover{color:var(--primary);text-decoration:underline}
  .sub{font-size:12px;color:var(--muted)}
  .chip{display:inline-block;background:#f1f2f7;border-radius:5px;padding:2px 7px;font-size:11.5px;margin:2px 4px 2px 0;color:var(--text)}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:13px}
  .status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .dots{background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:6px;color:var(--ink);font-size:18px;line-height:1;letter-spacing:1px}
  .dots:hover{background:#f1f2f7}
  .empty{color:var(--muted);text-align:center;padding:34px}
  .in{color:var(--green);font-weight:500} .out{color:var(--red);font-weight:500}

  /* Pagination footer */
  .table-foot{padding:12px 20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .table-foot b{color:var(--ink);font-weight:500}
  .pager{margin-left:auto;display:flex;align-items:center;gap:4px}
  .pager select{width:auto;padding:5px 8px;margin-right:8px;font-size:12.5px}
  .pager button{font:inherit;font-size:12.5px;min-width:30px;height:30px;border:1px solid var(--line2);background:#fff;border-radius:6px;cursor:pointer;color:var(--ink);padding:0 8px}
  .pager button:hover:not(:disabled){background:#f4f5fb}
  .pager button.cur{background:var(--primary);border-color:var(--primary);color:#fff}
  .pager button:disabled{opacity:.4;cursor:default}
  .pager .gap{padding:0 4px}

  /* ---------- Dropdown menu ---------- */
  .menu{position:absolute;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(25,30,60,.12);padding:6px;min-width:170px;z-index:40}
  .menu button{display:block;width:100%;text-align:left;font:inherit;font-size:13px;border:none;background:none;padding:8px 12px;border-radius:6px;cursor:pointer;color:var(--ink)}
  .menu button:hover{background:#f4f5fb}
  .menu button.danger{color:var(--red)}
  .menu button.active{color:var(--primary);background:var(--primary-soft)}
  .menu .menu-title{font-size:11px;color:var(--muted);padding:6px 12px 4px;text-transform:uppercase;letter-spacing:.5px}
  .menu .alert{padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;gap:16px}

  /* ---------- Point of sale ---------- */
  .pos-grid{display:grid;grid-template-columns:1.65fr 1fr;gap:20px;align-items:start}
  .pos-grid > *{min-width:0}
  @media (max-width:1050px){.pos-grid{grid-template-columns:1fr}}
  .cart-line{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
  .cart-line .name{color:var(--ink);font-weight:500;font-size:13px}
  .cart-line input{width:62px;padding:6px 8px;text-align:center}
  .totals{margin:16px 0 18px}
  .totals .r{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0}
  .totals .grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;font-size:14px;color:var(--muted)}
  .totals .grand b{font-size:24px;color:var(--ink);font-weight:600}

  /* ---------- Details / accounts ---------- */
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .acc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
  @media (max-width:1050px){.acc-grid,.two-col{grid-template-columns:1fr}}
  .pl-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
  .pl-row:last-child{border-bottom:none}
  .pl-row > span:first-child{color:var(--muted)}
  .pl-row.total-row > span{font-weight:600;color:var(--ink);font-size:14px}
  .bar-row{margin-bottom:14px;font-size:13px}
  .bar{height:6px;background:#f1f2f7;border-radius:4px;overflow:hidden;margin-top:6px}
  .bar div{height:100%;border-radius:4px}
  .logo-upload{display:flex;align-items:center;gap:14px}
  .logo-preview{width:64px;height:64px;border-radius:10px;border:1px dashed var(--line2);display:grid;place-items:center;overflow:hidden;background:#fafbfc;color:var(--muted);font-size:11px;flex-shrink:0}
  .logo-preview img{width:100%;height:100%;object-fit:cover}

  /* ---------- Modal, toast, receipt ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(20,24,40,.45);display:none;align-items:flex-start;justify-content:center;padding:50px 14px;overflow:auto;z-index:50}
  .modal-bg.open{display:flex}
  .modal{background:#fff;border-radius:12px;width:100%;max-width:560px;padding:24px}
  .modal h3{margin:0 0 16px;font-size:17px;font-weight:500;color:var(--ink)}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
  .checks{max-height:220px;overflow:auto;border:1px solid var(--line2);border-radius:7px;padding:8px 12px}
  .checks .grp{font-weight:500;font-size:12px;color:var(--muted);margin:8px 0 3px}
  .checks label{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:400;font-size:13px;margin:4px 0}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60;font-size:13px;white-space:nowrap}
  .toast.show{opacity:1}
  .receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#fafbfc;border:1px dashed #cfd3dc;padding:16px;border-radius:8px;color:var(--ink)}
  .receipt .r{display:flex;justify-content:space-between;gap:10px}
  .receipt hr{border:none;border-top:1px dashed #cfd3dc}
  .receipt img{display:block;max-width:70px;max-height:70px;margin:0 auto 8px;border-radius:6px}
  .note{background:#fff8ec;border:1px solid #f6e3c3;color:#8a5a00;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:18px}

  /* ---------- Mobile: bottom navigation + card-style tables ---------- */
  @media (max-width:760px){
    aside{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:64px;border-right:none;border-top:1px solid var(--line);flex-direction:row;box-shadow:0 -4px 16px rgba(25,30,60,.05)}
    .logo{display:none}
    .side-nav{flex-direction:row;padding:6px;gap:2px;width:100%}
    .side-nav .spacer{display:none}
    .side-nav a{flex:1;flex-direction:column;gap:3px;padding:6px 2px;font-size:10.5px;justify-content:center;text-align:center}
    .side-nav a svg{width:20px;height:20px}
    .side-nav a.active{background:var(--primary-soft);color:var(--primary)}
    .main{padding-bottom:64px}
    .topbar{padding:0 16px;position:sticky}
    .date-pill{display:none}
    .crumbs{padding:10px 16px}
    .content{padding:18px 14px 30px}
    .page-head h2{font-size:19px}
    .s-card{padding:16px 18px} .s-card .t{font-size:18px;margin-bottom:10px}
    .search{width:100%}
    .toolbar .right{margin-left:0;width:100%}
    .grid2{grid-template-columns:1fr}
    .toast{bottom:80px}

    /* tables become stacked cards */
    table.rt, table.rt tbody, table.rt tr, table.rt td{display:block;width:100%}
    table.rt tr.head{display:none}
    table.rt tr{border-bottom:1px solid var(--line);padding:10px 16px;position:relative}
    table.rt tbody tr:last-child{border-bottom:none}
    table.rt td{border:none;padding:4px 0 !important;display:flex;justify-content:space-between;align-items:center;gap:12px;white-space:normal;text-align:right}
    table.rt td::before{content:attr(data-label);color:var(--muted);font-size:12px;text-align:left;flex-shrink:0}
    table.rt td.first{font-size:14px;padding-bottom:8px !important}
    table.rt td.first::before{display:none}
    table.rt td.first{padding-right:60px !important;text-align:left}
    table.rt td.cb{position:absolute;right:56px;top:12px;width:auto;padding:0 !important}
    table.rt td.cb::before{display:none}
    table.rt td.act{position:absolute;right:10px;top:6px;width:auto;padding:0 !important}
    table.rt td.act::before{display:none}
    tbody tr:hover td{background:none}
    .pager{margin-left:0;width:100%;justify-content:flex-end}
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="logo"><div class="logo-mark" id="logoMark"></div><span class="name" id="logoName"></span></div>
    <nav class="side-nav" id="nav">
      <a href="#dashboard" data-view="dashboard"><svg viewBox="0 0 24 24" class="i"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
      <a href="#inventory" data-view="inventory"><svg viewBox="0 0 24 24" class="i"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg>Inventory</a>
      <a href="#records" data-view="records"><svg viewBox="0 0 24 24" class="i"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Records</a>
      <a href="#accounts" data-view="accounts"><svg viewBox="0 0 24 24" class="i"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Accounts</a>
      <div class="spacer"></div>
      <a href="#settings" data-view="settings"><svg viewBox="0 0 24 24" class="i"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</a>
    </nav>
    <div style="height:18px"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1 id="tbTitle">Dashboard</h1>
      <div class="tb-right">
        <div class="date-pill"><svg viewBox="0 0 24 24" class="i"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span id="todayLabel"></span></div>
        <button class="bell" id="bell" onclick="bellMenu(event)" title="Stock alerts">
          <svg viewBox="0 0 24 24" class="i"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
        <div class="avatar" title="Settings" onclick="go('settings')">AD</div>
      </div>
    </div>
    <div class="crumbs" id="crumbs"></div>
    <div class="content"><div class="inner" id="app"></div></div>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   STORAGE  (localStorage, with an in-memory fallback)
   ============================================================ */
const STORE_KEY = 'hardware_pm_v1';
const EXPENSE_CATEGORIES = ['Rent','Salaries','Utilities','Transport','Stock purchase','Other'];
const PAYMENTS = ['Cash','Mobile Money','Card','Bank Transfer'];
const DEFAULT_SETTINGS = {currency:'K', vat:0, receiptFooter:'Thank you for your business!', defaultReorder:5, logo:''};
let memoryFallback = null;

function seedData(){
  const now = new Date().toISOString();
  const brands = [
    {id:'b1', name:'Toyota'}, {id:'b2', name:'Nissan'}, {id:'b3', name:'Honda'}, {id:'b4', name:'Mitsubishi'}
  ];
  const models = [

// items: [{label, fn, danger, active}] or {title} or {html}
function openMenu(e, items){
  e.stopPropagation(); closeMenu();
  const m = document.createElement('div'); m.className = 'menu';
  items.forEach(it => {
    if(it.title){ const t = document.createElement('div'); t.className='menu-title'; t.textContent = it.title; m.appendChild(t); return; }
    if(it.html){ const h = document.createElement('div'); h.innerHTML = it.html; m.appendChild(h); return; }
    const b = document.createElement('button'); b.textContent = it.label;
    if(it.danger) b.className = 'danger'; if(it.active) b.className = 'active';
    b.onclick = ev => { ev.stopPropagation(); closeMenu(); it.fn(); };
    m.appendChild(b);
  });
  m.addEventListener('click', ev => ev.stopPropagation());
  document.body.appendChild(m);
  const r = e.currentTarget.getBoundingClientRect();
  let left = Math.max(8, Math.min(r.right - m.offsetWidth, window.innerWidth - m.offsetWidth - 8));
  let top = r.bottom + 6 + window.scrollY;
  if(r.bottom + m.offsetHeight + 10 > window.innerHeight) top = r.top - m.offsetHeight - 6 + window.scrollY;
  m.style.left = left + 'px'; m.style.top = top + 'px';
  menuEl = m;
}

/* ---------- Date ranges ---------- */
const DATE_LABELS = {all:'Date', today:'Today', week:'This week', month:'This month', last:'Last month', custom:'Custom'};
const periodName = r => r === 'all' ? 'All time' : DATE_LABELS[r];
function rangeOf(st){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  if(st.range === 'today') return {from:todayStr(), to:todayStr()};
  if(st.range === 'week'){ const d = new Date(now); d.setDate(now.getDate() - ((now.getDay()+6)%7)); return {from:ymd(d), to:todayStr()}; }
  if(st.range === 'month') return {from:ymd(new Date(y,m,1)), to:ymd(new Date(y,m+1,0))};
  if(st.range === 'last')  return {from:ymd(new Date(y,m-1,1)), to:ymd(new Date(y,m,0))};
  if(st.range === 'custom') return {from:st.from||'', to:st.to||''};
  return {from:'', to:''};
}
function inRange(iso, r){
  const d = new Date(iso);
  if(r.from && d < new Date(r.from + 'T00:00:00')) return false;
  if(r.to && d > new Date(r.to + 'T23:59:59')) return false;
  return true;
}
function dateMenu(e, key){

    active: st.range === k,
    fn: () => { if(k === 'custom'){ customDates(key); return; } st.range = k; st.page = 1; route(); }

/* ============================================================
   TABLE ENGINE  — sorting, pagination, selection, mobile cards
   ============================================================ */
const mk = extra => Object.assign({q:'', open:false, page:1, size:10, sort:null, sel:new Set()}, extra);
const STATE = {
  pos:       mk({model:'', size:8}),
  parts:     mk({model:'', stock:''}),
  models:    mk({brand:''}),
  sales:     mk({range:'all', from:'', to:'', pay:''}),
  stock:     mk({range:'all', from:'', to:'', type:''}),
  exp:       mk({range:'month', from:'', to:'', cat:''}),
  partSales: mk({size:5}),
  partStock: mk({size:5})
};
const TABLES = {};     // key -> function returning table config
const VISIBLE = {};    // key -> ids on the current page

/* Config: {rows, id(row), columns:[{key,label,html(row),sort(row),num,cls,first}], checkbox, actions(row), empty, rowClass(row)} */
function drawTable(key){
  const el = $('#tb_' + key); if(!el) return;
  const cfg = TABLES[key](), st = STATE[key];
  let rows = cfg.rows.slice();
  if(st.sort){
    const col = cfg.columns.find(c => c.key === st.sort.col);
    if(col && col.sort) rows.sort((a,b) => {
      const x = col.sort(a), y = col.sort(b);
      return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), undefined, {numeric:true})) * st.sort.dir;
    });
  }
  const total = rows.length, pages = Math.max(1, Math.ceil(total / st.size));
  if(st.page > pages) st.page = pages;
  const start = (st.page - 1) * st.size, pageRows = rows.slice(start, start + st.size);
  VISIBLE[key] = pageRows.map(cfg.id);

  if(!total){ el.innerHTML = `<div class="empty">${cfg.empty || 'Nothing to show.'}</div>`; $('#tf_'+key).innerHTML = ''; if(cfg.bulk) cfg.bulk(); return; }

  const allSel = VISIBLE[key].length && VISIBLE[key].every(id => st.sel.has(id));
  const head = `<tr class="head">
    ${cfg.checkbox ? `<th class="cb"><input type="checkbox" ${allSel?'checked':''} onclick="toggleAll('${key}', this.checked)" title="Select this page"></th>` : ''}
    ${cfg.columns.map(c => {
      const sorted = st.sort && st.sort.col === c.key;
      const arrow = sorted ? (st.sort.dir > 0 ? '▲' : '▼') : '▲';
      return `<th class="${c.num?'num':''} ${c.sort?'sortable':''} ${sorted?'sorted':''}" ${c.sort?`onclick="sortBy('${key}','${c.key}')"`:''}>${esc(c.label)}${c.sort?`<span class="arrow">${arrow}</span>`:''}</th>`;
    }).join('')}
    ${cfg.actions ? '<th class="num">Action</th>' : ''}</tr>`;
  const body = pageRows.map(r => {
    const id = cfg.id(r);
    return `<tr class="${st.sel.has(id)?'sel':''} ${cfg.rowClass ? cfg.rowClass(r) : ''}">
      ${cfg.checkbox ? `<td class="cb"><input type="checkbox" ${st.sel.has(id)?'checked':''} onclick="toggleSel('${key}','${esc(id)}',this.checked)"></td>` : ''}
      ${cfg.columns.map((c,i) => `<td data-label="${esc(c.label)}" class="${c.num?'num':''} ${c.cls||''} ${i===0?'first':''}">${c.html(r)}</td>`).join('')}
      ${cfg.actions ? `<td class="num act">${cfg.actions(r)}</td>` : ''}
    </tr>`;
  }).join('');
  el.innerHTML = `<table class="rt">${head}${body}</table>`;

  // footer: counts + pager
  const btns = [];
  const addPage = n => btns.push(`<button class="${n===st.page?'cur':''}" onclick="setPage('${key}',${n})">${n}</button>`);
  let lo = Math.max(1, st.page - 2), hi = Math.min(pages, lo + 4); lo = Math.max(1, hi - 4);
  if(lo > 1){ addPage(1); if(lo > 2) btns.push('<span class="gap">…</span>'); }
  for(let n = lo; n <= hi; n++) addPage(n);
  if(hi < pages){ if(hi < pages - 1) btns.push('<span class="gap">…</span>'); addPage(pages); }
  const selCount = [...st.sel].length;
  $('#tf_'+key).innerHTML = `<div class="table-foot">
    <span>Showing <b>${start+1}–${start+pageRows.length}</b> of <b>${total}</b></span>
    ${cfg.checkbox && selCount ? `<span>Selected <b>${selCount}</b></span>` : ''}
    ${cfg.footer ? cfg.footer(rows) : ''}
    <div class="pager">
      <select onchange="setPageSize('${key}', this.value)" title="Rows per page">${[5,8,10,25,50].filter(n => n>=5).map(n=>`<option value="${n}" ${n===st.size?'selected':''}>${n} / page</option>`).join('')}</select>
      <button ${st.page<=1?'disabled':''} onclick="setPage('${key}',${st.page-1})" title="Previous">‹</button>
      ${btns.join('')}
      <button ${st.page>=pages?'disabled':''} onclick="setPage('${key}',${st.page+1})" title="Next">›</button>
    </div></div>`;
  if(cfg.bulk) cfg.bulk();
}
function sortBy(key, col){
  const st = STATE[key];
  if(st.sort && st.sort.col === col){ if(st.sort.dir === 1) st.sort.dir = -1; else st.sort = null; }
  else st.sort = {col, dir:1};
  drawTable(key);
}
function setPage(key, n){ STATE[key].page = n; drawTable(key); }
function setPageSize(key, n){ STATE[key].size = parseInt(n); STATE[key].page = 1; drawTable(key); }
function toggleSel(key, id, on){ on ? STATE[key].sel.add(id) : STATE[key].sel.delete(id); drawTable(key); }
function toggleAll(key, on){ (VISIBLE[key]||[]).forEach(id => on ? STATE[key].sel.add(id) : STATE[key].sel.delete(id)); drawTable(key); }
function toggleFilter(key){ STATE[key].open = !STATE[key].open; route(); }
function bindSearch(key){
  const el = $('#q_'+key); if(!el) return;
  el.oninput = e => { STATE[key].q = e.target.value; STATE[key].page = 1; drawTable(key); };
}
function bindFilter(selector, key, field, rerender){
  const el = $(selector); if(!el) return;
  el.onchange = e => { STATE[key][field] = e.target.value; STATE[key].page = 1; rerender ? route() : drawTable(key); };
}

function exportCSV(name, header, rows){
  const csv = [header, ...rows].map(r => r.map(v => {
    const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\n');
  const done = () => toast(`${rows.length} row(s) copied as CSV — paste into Excel or Sheets`);
  const fallback = () => openModal(`<h3>Export ${esc(name)}</h3><p class="sub" style="margin-top:0">Copy this and paste it into Excel or Google Sheets.</p>
      <textarea rows="10" style="font-family:monospace;font-size:12px" onclick="this.select()">${esc(csv)}</textarea>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Done</button></div>`);
  try{ navigator.clipboard.writeText(csv).then(done, fallback); }catch(e){ fallback(); }
}

function showLowStock(){ Object.assign(STATE.parts, {q:'', model:'', stock:'low', open:true, page:1}); invTab = 'parts'; go('inventory'); }

function addToCart(id){
  const p = partById(id), line = cart.find(c=>c.partId===id);
  const qty = (line ? line.qty : 0) + 1;
  if(qty > p.stock) return toast('Not enough stock');
  if(line) line.qty = qty; else cart.push({partId:id, qty:1});
  drawCart(); drawTable('pos');
}
function setQty(id, val){
  const p = partById(id), line = cart.find(c=>c.partId===id);
  let q = parseInt(val)||0;
  if(q > p.stock){ q = p.stock; toast(`Only ${p.stock} in stock`); }
  if(q <= 0) cart = cart.filter(c=>c.partId!==id); else line.qty = q;
  drawCart(); drawTable('pos');
}
function cartTotals(){
  const subtotal = round2(cart.reduce((a,c)=>a + partById(c.partId).price*c.qty, 0));
  const vat = round2(subtotal * (Number(db.settings.vat)||0) / 100);
  return {subtotal, vat, total: round2(subtotal + vat)};
}

function drawCart(){
  cart = cart.filter(c => partById(c.partId));
  const t = cartTotals(), units = cart.reduce((a,c)=>a+c.qty,0), vatRate = Number(db.settings.vat)||0;
  $('#cartBox').innerHTML = `
    <div class="card-head"><h3>Current Sale</h3>${units ? `<span class="sub">${units} item(s)</span>` : ''}</div>
    <div class="card-body">
      ${cart.length ? cart.map(c => { const p = partById(c.partId); return `
        <div class="cart-line">
          <div style="flex:1;min-width:0"><div class="name">${esc(p.name)}</div><div class="sub">${money(p.price)} each</div></div>
          <input type="number" min="0" max="${p.stock}" value="${c.qty}" onchange="setQty('${p.id}', this.value)">
          <div style="width:92px;text-align:right;font-weight:500;color:var(--ink)">${money(p.price*c.qty)}</div>
          <button class="dots" style="font-size:14px" onclick="setQty('${p.id}',0)" title="Remove">✕</button>
        </div>`; }).join('') : '<div class="empty" style="padding:26px 0">Add parts to start a sale.</div>'}
      <div class="totals">
        ${vatRate ? `<div class="r"><span>Subtotal</span><span>${money(t.subtotal)}</span></div>
                     <div class="r"><span>VAT (${vatRate}%)</span><span>${money(t.vat)}</span></div>` : ''}
        <div class="grand"><span>Total</span><b>${money(t.total)}</b></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Payment method</label><select id="pay">${PAYMENTS.map(p=>`<option>${p}</option>`).join('')}</select></div>
        <div class="field"><label>Customer (optional)</label><input id="cust" placeholder="Name or phone"></div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn outline" ${cart.length?'':'disabled'} onclick="cart=[];drawCart();drawTable('pos')">Clear</button>
        <button class="btn lg" style="flex:1;justify-content:center" ${cart.length?'':'disabled'} onclick="checkout()">Complete Sale</button>
      </div>
    </div>`;
}

function checkout(){
  if(!cart.length) return;
  for(const c of cart){
    const p = partById(c.partId);
    if(!p || c.qty > p.stock) return toast(`Not enough stock for ${p ? p.name : 'a part'}`);
  }
  const id = String(db.sales.length + 1).padStart(5,'0');
  const t = cartTotals();
  const items = cart.map(c => { const p = partById(c.partId); return {partId:p.id, sku:p.sku, name:p.name, price:p.price, cost:p.cost, qty:c.qty}; });
  items.forEach(i => { const p = partById(i.partId); p.stock -= i.qty; logMovement(p, 'Sale', -i.qty, 'Receipt #' + id); });
  const sale = {
    id, date: new Date().toISOString(), items,
    subtotal:t.subtotal, vat:t.vat, vatRate:Number(db.settings.vat)||0, total:t.total,
    payment: $('#pay').value, customer: $('#cust').value.trim()
  };
  db.sales.push(sale); cart = []; save();
  route();
  openModal(`<h3>Sale complete ✓</h3>${receiptHTML(sale)}
    <div class="modal-actions"><button class="btn" onclick="closeModal()">New Sale</button></div>`);
}

function modelOptions(selected, allLabel){
  return `<option value="">${esc(allLabel)}</option>` + db.brands.map(b => {
    const ms = db.models.filter(m => m.brandId === b.id);
    if(!ms.length) return '';
    return `<optgroup label="${esc(b.name)}">${ms.map(m=>`<option value="${m.id}" ${m.id===selected?'selected':''}>${esc(b.name)} ${esc(m.name)}</option>`).join('')}</optgroup>`;
  }).join('');
}
function filterParts(f){
  const q = (f.q||'').toLowerCase().trim();
  return db.parts.filter(p => {
    if(q && ![p.name,p.sku,p.category].join(' ').toLowerCase().includes(q)) return false;
    if(f.model && !p.modelIds.includes(f.model)) return false;
    if(f.stock === 'low' && p.stock > p.reorder) return false;
    if(f.stock === 'in' && p.stock <= 0) return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name));
}
// Show up to two vehicles, then "+N"
function fitsCell(p){
  const ms = p.modelIds.map(id => modelById(id)).filter(Boolean);
  if(!ms.length) return '<span class="sub">Not linked</span>';
  return `<span title="${esc(ms.map(modelLabel).join(', '))}">${ms.slice(0,2).map(m=>`<span class="chip">${esc(modelLabel(m))}</span>`).join('')}${ms.length>2?`<span class="chip">+${ms.length-2}</span>`:''}</span>`;
}

function partForm(id){
  const p = id ? partById(id) : {sku:'', name:'', category:'', cost:'', price:'', stock:0, reorder:db.settings.defaultReorder, modelIds:[]};
  const checks = db.brands.map(b => {
    const ms = db.models.filter(m => m.brandId === b.id);
    if(!ms.length) return '';
    return `<div class="grp">${esc(b.name)}</div>` + ms.map(m => `<label><input type="checkbox" name="models" value="${m.id}" ${p.modelIds.includes(m.id)?'checked':''}> ${esc(m.name)} ${m.years?`<span class="sub">(${esc(m.years)})</span>`:''}</label>`).join('');
  }).join('');
  openModal(`<h3>${id ? 'Edit' : 'Add'} spare part</h3>
    <form id="f">
      <div class="grid2">
        <div class="field"><label>Part name</label><input name="name" required value="${esc(p.name)}" placeholder="e.g. Oil Filter"></div>
        <div class="field"><label>SKU / part number</label><input name="sku" required value="${esc(p.sku)}" placeholder="e.g. OF-1001"></div>
        <div class="field"><label>Category</label><input name="category" value="${esc(p.category)}" list="cats"></div>
        <div class="field"><label>Reorder level</label><input name="reorder" type="number" min="0" step="1" required value="${p.reorder}"></div>
        <div class="field"><label>Cost price (${esc(cur())})</label><input name="cost" type="number" min="0" step="0.01" required value="${p.cost}"></div>
        <div class="field"><label>Selling price (${esc(cur())})</label><input name="price" type="number" min="0" step="0.01" required value="${p.price}"></div>
        <div class="field"><label>${id ? 'Quantity in stock' : 'Opening stock'}</label><input name="stock" type="number" min="0" step="1" required value="${p.stock}"></div>
      </div>
      <datalist id="cats">${[...new Set(db.parts.map(x=>x.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
      <div class="field"><label>Compatible vehicle models</label>
        <div class="checks">${checks || '<span class="sub">Add vehicle brands and models first.</span>'}</div></div>
      <div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">Save Part</button></div>
    </form>`);
  $('#f').onsubmit = e => {
    e.preventDefault();
    const f = e.target;
    const data = {
      name:f.name.value.trim(), sku:f.sku.value.trim().toUpperCase(), category:f.category.value.trim(),
      cost:Math.max(0, parseFloat(f.cost.value)||0), price:Math.max(0, parseFloat(f.price.value)||0),
      stock:Math.max(0, parseInt(f.stock.value)||0), reorder:Math.max(0, parseInt(f.reorder.value)||0),
      modelIds:[...f.querySelectorAll('input[name=models]:checked')].map(c=>c.value)
    };
    if(db.parts.some(x => x.sku === data.sku && x.id !== id)) return toast('That SKU is already in use');
    if(id){
      const diff = data.stock - p.stock;
      Object.assign(p, data);
      if(diff) logMovement(p, 'Adjustment', diff, 'Edited stock count');
    } else {
      const np = {id:newId('p'), ...data};
      db.parts.push(np);
      if(np.stock) logMovement(np, 'Opening stock', np.stock);
    }
    save(); closeModal(); toast('Part saved'); route();
  };
}

// Stock entry: called with a part id (Restock) or without (pick the part)
function restockForm(id){
  if(!db.parts.length) return toast('Add a spare part first');
  const parts = db.parts.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const first = id ? partById(id) : parts[0];
  openModal(`<h3>${id ? 'Restock: ' + esc(first.name) : 'New stock entry'}</h3>
    <form id="f">
      ${id ? `<p class="sub" style="margin-top:-6px">Currently ${first.stock} in stock.</p>` : `<div class="field"><label>Part</label>
        <select name="part">${parts.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.sku)}) · ${p.stock} in stock</option>`).join('')}</select></div>`}
      <div class="grid2">
        <div class="field"><label>Quantity received</label><input name="qty" type="number" min="1" step="1" required value="1"></div>
        <div class="field"><label>Unit cost (${esc(cur())})</label><input name="cost" type="number" min="0" step="0.01" required value="${first.cost}"></div>
      </div>
      <div class="field"><label>Supplier (optional)</label><input name="ref"></div>
      <label style="display:flex;gap:8px;align-items:center;color:var(--text);font-weight:400;font-size:13px"><input type="checkbox" name="exp" checked>
        Record this as a stock purchase expense in Accounts</label>
      <div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">Add to Stock</button></div></form>`);
  if(!id) $('#f').part.onchange = e => { $('#f').cost.value = partById(e.target.value).cost; };
  $('#f').onsubmit = e => {
    e.preventDefault();
    const f = e.target, p = id ? first : partById(f.part.value);
    const q = parseInt(f.qty.value)||0; if(q<=0) return;
    const cost = Math.max(0, parseFloat(f.cost.value)||0);
    p.stock += q; p.cost = cost;
    logMovement(p, 'Restock', q, f.ref.value.trim());
    if(f.exp.checked && cost > 0){
      db.expenses.push({id:newId('e'), date:todayStr(), description:`Restock ${q} × ${p.name}`, category:'Stock purchase', amount:cost*q});
    }
    save(); closeModal(); toast(`Added ${q} × ${p.name}`); route();
  };
}
function deletePart(id){
  confirmBox(`Delete ${partById(id).name}? Past sales and stock records are kept.`, () => {
    db.parts = db.parts.filter(p => p.id !== id);
    cart = cart.filter(c => c.partId !== id); STATE.parts.sel.delete(id);
    save(); toast('Part deleted');
    if(location.hash === '#part-' + id) go('inventory'); else route();
  });
}
function deleteSelectedParts(){
  const ids = [...STATE.parts.sel].filter(id => partById(id));
  confirmBox(`Delete ${ids.length} selected part(s)? Past sales and stock records are kept.`, () => {
    db.parts = db.parts.filter(p => !ids.includes(p.id));
    cart = cart.filter(c => !ids.includes(c.partId)); STATE.parts.sel.clear();
    save(); toast(`${ids.length} part(s) deleted`); route();
  });
}

  return rows.reverse();
}

    ])}
    <div class="two-col">
      <div class="card"><div class="card-head"><h3>Part Information</h3></div><div class="card-body">
        <div class="pl-row"><span>Category</span><span>${esc(p.category || '—')}</span></div>
        <div class="pl-row"><span>Cost price</span><span>${money(p.cost)}</span></div>
        <div class="pl-row"><span>Selling price</span><span>${money(p.price)}</span></div>
        <div class="pl-row"><span>Profit per unit</span><span>${money(p.price - p.cost)} · ${margin}%</span></div>
        <div class="pl-row"><span>Reorder level</span><span>${p.reorder}</span></div>
        <div class="pl-row"><span>Status</span><span>${stockStatus(p)}</span></div>
        <div class="pl-row"><span>Stock value (cost)</span><span>${money(p.cost * Math.max(p.stock,0))}</span></div>
      </div></div>
      <div class="card"><div class="card-head"><h3>Compatible Vehicles</h3><span class="sub">${vehicles.length} model(s)</span></div><div class="card-body">
        ${vehicles.length ? vehicles.map(m => `<div class="pl-row"><span style="color:var(--ink)">${esc(modelLabel(m))}</span><span class="sub">${esc(m.years||'')}</span></div>`).join('')

      </div></div>
    </div>

function brandForm(id){
  const b = id ? brandById(id) : {name:''};
  openModal(`<h3>${id ? 'Edit' : 'Add'} brand</h3>
    <form id="f"><div class="field"><label>Brand name</label><input name="name" required value="${esc(b.name)}" placeholder="e.g. Toyota"></div>

  $('#f').onsubmit = e => {

    const name = e.target.name.value.trim();
    if(!name) return;
    if(db.brands.some(x => x.name.toLowerCase() === name.toLowerCase() && x.id !== id)) return toast('That brand already exists');

  };

function deleteBrand(id){
  const ms = db.models.filter(m => m.brandId === id);
  confirmBox(`Delete ${brandById(id).name}${ms.length ? ' and its ' + ms.length + ' model(s)' : ''}? Parts will stay, but lose these compatibility links.`, () => {
    const ids = ms.map(m => m.id);
    db.parts.forEach(p => p.modelIds = p.modelIds.filter(x => !ids.includes(x)));
    db.models = db.models.filter(m => m.brandId !== id);
    db.brands = db.brands.filter(b => b.id !== id);
    save(); toast('Brand deleted'); route();
  });
}
function modelForm(id, presetBrand){
  if(!db.brands.length) return toast('Add a brand first');
  const m = id ? modelById(id) : {name:'', years:'', brandId: presetBrand || db.brands[0].id};
  openModal(`<h3>${id ? 'Edit' : 'Add'} model</h3>

function salesRows(){
  const st = STATE.sales, q = st.q.toLowerCase().trim(), r = rangeOf(st), rows = [];
  db.sales.forEach(s => {
    if(!inRange(s.date, r) || (st.pay && s.payment !== st.pay)) return;
    s.items.forEach((i, n) => {
      if(q && ![s.id, s.customer, s.payment, i.name, i.sku].join(' ').toLowerCase().includes(q)) return;
      rows.push({key:s.id + '-' + n, s, i});
    });
  });
  return rows.reverse();
}
function stockRows(){
  const st = STATE.stock, q = st.q.toLowerCase().trim(), r = rangeOf(st);
  return db.movements.filter(m => m.type !== 'Sale' && inRange(m.date, r) && (!st.type || m.type === st.type) &&
    (!q || [m.name, m.sku, m.type, m.ref].join(' ').toLowerCase().includes(q))).reverse();
}

   ACCOUNTS  (income, costs, expenses, profit)
   ============================================================ */
function expenseRows(){
  const st = STATE.exp, q = st.q.toLowerCase().trim(), r = rangeOf(st);
  return db.expenses.filter(e => inRange(e.date + 'T12:00:00', r) && (!st.cat || e.category === st.cat) &&
    (!q || [e.description, e.category].join(' ').toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date));
}

function renderAccounts(){
  const st = STATE.exp, r = rangeOf(st), periodLabel = periodName(st.range);
  const sales = db.sales.filter(s => inRange(s.date, r));
  const allExp = db.expenses.filter(e => inRange(e.date + 'T12:00:00', r));
  const revenue = sales.reduce((a,s)=>a+saleNet(s),0);
  const vatCollected = sales.reduce((a,s)=>a+(s.vat||0),0);
  const cogs = sales.reduce((a,s)=>a+s.items.reduce((b,i)=>b+itemCost(i)*i.qty,0),0);
  const gross = revenue - cogs;
  const expTotal = allExp.reduce((a,e)=>a+e.amount,0);
  const net = gross - expTotal;

  const byPay = {}; sales.forEach(s => byPay[s.payment] = (byPay[s.payment]||0) + s.total);
  const payTotal = Object.values(byPay).reduce((a,b)=>a+b,0);
  const byCat = {}; allExp.forEach(e => byCat[e.category] = (byCat[e.category]||0) + e.amount);
  const bars = (obj, total, colorOf) => Object.entries(obj).sort((a,b)=>b[1]-a[1]).map(([k,v]) => `
    <div class="bar-row"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><span style="color:var(--ink);font-weight:500">${money(v)}</span></div>
    <div class="bar"><div style="width:${total ? (v/total*100).toFixed(1) : 0}%;background:var(--${colorOf(k)})"></div></div></div>`).join('');
  const missingCost = db.parts.some(p => !p.cost);

  $('#app').innerHTML = `
    <div class="page-head"><h2>Accounts Summary</h2>
      <button class="btn outline lg ${st.range!=='all'?'on':''}" onclick="dateMenu(event,'exp')">${ICON.date}${esc(periodLabel)}</button>
      <button class="btn lg" onclick="expenseForm()">${ICON.plus}Add Expense</button></div>
    ${missingCost ? '<div class="note">Some parts have no cost price, so their cost counts as zero. Add cost prices in Inventory for accurate profit.</div>' : ''}
    ${summaryCards([
      {title:'Sales Income', color:'blue', value:'Total ' + money(revenue), period:periodLabel},
      {title:'Expenses', color:'orange', value:'Total ' + money(expTotal), period:periodLabel},
      {title:'Net Profit', color: net >= 0 ? 'green' : 'red', value:'Total ' + money(net), period:periodLabel}
    ])}
    <div class="acc-grid">
      <div class="card"><div class="card-head"><h3>Profit &amp; Loss</h3></div><div class="card-body">
        <div class="pl-row"><span>Sales income${vatCollected ? ' (excl. VAT)' : ''}</span><span>${money(revenue)}</span></div>
        <div class="pl-row"><span>Cost of parts sold</span><span>− ${money(cogs)}</span></div>
        <div class="pl-row total-row"><span>Gross profit</span><span>${money(gross)}</span></div>
        <div class="pl-row"><span>Expenses</span><span>− ${money(expTotal)}</span></div>
        <div class="pl-row total-row"><span>Net profit</span><span class="c-${net>=0?'green':'red'}">${money(net)}</span></div>
        ${vatCollected ? `<div class="pl-row"><span>VAT collected (owed to tax authority)</span><span>${money(vatCollected)}</span></div>` : ''}
      </div></div>
      <div class="card"><div class="card-head"><h3>Income by Payment</h3></div><div class="card-body">
        ${Object.keys(byPay).length ? bars(byPay, payTotal, payColor) : '<div class="empty">No sales in this period.</div>'}</div></div>
      <div class="card"><div class="card-head"><h3>Expenses by Category</h3></div><div class="card-body">
        ${Object.keys(byCat).length ? bars(byCat, expTotal, catColor) : '<div class="empty">No expenses in this period.</div>'}</div></div>
    </div>
    ${tableCard({
      title:'Expenses', key:'exp', placeholder:'Search expenses', exportFn:'exportExpenses',
      filter:`<div><label>Category</label><select id="f_cat"><option value="">All</option>
        ${EXPENSE_CATEGORIES.map(c=>`<option ${c===st.cat?'selected':''}>${c}</option>`).join('')}</select></div>`
    })}`;
  bindSearch('exp');
  bindFilter('#f_cat', 'exp', 'cat');
  drawTable('exp');
}

function exportExpenses(){
  const rows = pickRows('exp', expenseRows(), e=>e.id);
  exportCSV('expenses', ['Date','Description','Category','Amount'], rows.map(e => [e.date, e.description, e.category, e.amount]));
}
function expenseForm(id){
  const x = id ? db.expenses.find(e=>e.id===id) : {date:todayStr(), description:'', category:'Other', amount:''};
  openModal(`<h3>${id ? 'Edit' : 'Add'} expense</h3>
    <form id="f">
      <div class="grid2">
        <div class="field"><label>Date</label><input type="date" name="date" required value="${x.date}"></div>
        <div class="field"><label>Amount (${esc(cur())})</label><input type="number" name="amount" min="0.01" step="0.01" required value="${x.amount}"></div>
      </div>
      <div class="field"><label>Description</label><input name="description" required value="${esc(x.description)}" placeholder="e.g. Shop rent for November"></div>
      <div class="field"><label>Category</label><select name="category">${EXPENSE_CATEGORIES.map(c=>`<option ${c===x.category?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">Save Expense</button></div>
    </form>`);
  $('#f').onsubmit = e => {
    e.preventDefault();
    const f = e.target, data = {date:f.date.value, amount:parseFloat(f.amount.value)||0, description:f.description.value.trim(), category:f.category.value};
    if(data.amount <= 0 || !data.description) return;
    if(id) Object.assign(x, data); else db.expenses.push({id:newId('e'), ...data});
    save(); closeModal(); toast('Expense saved'); route();
  };
}
function deleteExpense(id){
  confirmBox('Delete this expense?', () => {
    db.expenses = db.expenses.filter(e => e.id !== id); STATE.exp.sel.delete(id);
    save(); toast('Expense deleted'); route();
  });
}
function deleteSelectedExpenses(){
  const ids = [...STATE.exp.sel];
  confirmBox(`Delete ${ids.length} selected expense(s)?`, () => {
    db.expenses = db.expenses.filter(e => !ids.includes(e.id)); STATE.exp.sel.clear();
    save(); toast('Expenses deleted'); route();
  });
}

let pendingLogo = null;   // logo chosen but not yet saved (undefined = unchanged)
function renderSettings(){
  const s = db.settings;
  pendingLogo = undefined;
  $('#app').innerHTML = `
    <div class="page-head"><h2>Settings</h2></div>
    <form id="sf">
      <div class="two-col">
        <div class="card"><div class="card-head"><h3>Shop Details</h3></div><div class="card-body">
          <div class="field"><label>Shop name</label><input name="shopName" required value="${esc(db.shopName)}"></div>
          <div class="field"><label>Logo</label>
            <div class="logo-upload">
              <div class="logo-preview" id="logoPrev">${s.logo ? `<img src="${s.logo}" alt="">` : 'No logo'}</div>
              <div>
                <input type="file" id="logoFile" accept="image/*" style="display:none">
                <button type="button" class="btn outline sm" onclick="$('#logoFile').click()">Upload logo</button>
                <button type="button" class="btn danger sm" id="logoRemove" ${s.logo?'':'style="display:none"'}>Remove</button>
                <div class="hint">Square image works best. Shown in the sidebar and on receipts.</div>
              </div>
            </div>
          </div>
          <div class="field"><label>Receipt footer</label><textarea name="receiptFooter" rows="2" placeholder="e.g. Thank you for your business!">${esc(s.receiptFooter)}</textarea>
            <div class="hint">Printed at the bottom of every receipt.</div></div>
        </div></div>
        <div class="card"><div class="card-head"><h3>Sales &amp; Stock</h3></div><div class="card-body">
          <div class="field"><label>Currency symbol</label><input name="currency" required maxlength="5" value="${esc(s.currency)}">
            <div class="hint">Shown before every amount.</div></div>
          <div class="field"><label>VAT / tax rate (%)</label><input name="vat" type="number" min="0" max="100" step="0.01" value="${s.vat}">
            <div class="hint">Added on top of prices at checkout. Set to 0 to turn VAT off.</div></div>
          <div class="field"><label>Default reorder level</label><input name="defaultReorder" type="number" min="0" step="1" value="${s.defaultReorder}">
            <div class="hint">Used for new parts. A part shows as low stock at or below this quantity.</div></div>
        </div></div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button type="button" class="btn outline lg" onclick="renderSettings()">Discard changes</button>
        <button class="btn lg">Save Settings</button>
      </div>
    </form>`;

  $('#logoFile').onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    shrinkImage(file, 200).then(url => {
      pendingLogo = url;
      $('#logoPrev').innerHTML = `<img src="${url}" alt="">`;
      $('#logoRemove').style.display = '';
    }).catch(() => toast('Could not read that image'));
  };
  $('#logoRemove').onclick = () => { pendingLogo = ''; $('#logoPrev').innerHTML = 'No logo'; $('#logoRemove').style.display = 'none'; };
  $('#sf').onsubmit = e => {
    e.preventDefault();
    const f = e.target;
    db.shopName = f.shopName.value.trim() || 'PartsPro';
    Object.assign(db.settings, {
      currency: f.currency.value.trim() || 'K',
      vat: Math.min(100, Math.max(0, parseFloat(f.vat.value) || 0)),
      defaultReorder: Math.max(0, parseInt(f.defaultReorder.value) || 0),
      receiptFooter: f.receiptFooter.value.trim()
    });
    if(pendingLogo !== undefined) db.settings.logo = pendingLogo;
    if(save()) toast('Settings saved');
    route();
  };
}
// Resize an uploaded image so it fits comfortably in browser storage
function shrinkImage(file, max){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

route();
