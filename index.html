<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leiden Investment Limited</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f8; --card:#fff; --ink:#16181f; --text:#3b3f4c; --muted:#8b8f9c; --line:#efeff3; --line2:#e3e4ea;
    --primary:#c01c2c; --primary-dark:#9e1623; --primary-soft:#fdeef0;
    --blue:#c01c2c; --orange:#e8871e; --red:#d92d3a; --green:#1f9d55; --purple:#7c4dcc;
    --radius:14px; --r-sm:9px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 2px 8px rgba(16,24,40,.04);
    --shadow-lg:0 12px 40px rgba(16,24,40,.14);
    --ease:cubic-bezier(.2,.7,.3,1);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;-webkit-font-smoothing:antialiased}
  svg.i{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- Layout ---------- */
  .layout{display:flex;min-height:100vh}
  aside{width:248px;flex-shrink:0;background:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:30;box-shadow:1px 0 0 var(--line)}
  .logo{display:flex;align-items:center;gap:10px;padding:28px 26px 32px;font-weight:600;font-size:17px;color:var(--ink);overflow:hidden}
  .logo .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logo-mark{width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center;flex-shrink:0;overflow:hidden}
  .logo-mark img{width:100%;height:100%;object-fit:cover;background:#fff}
  .logo .wordmark{display:block;max-width:100%;height:38px;object-fit:contain;object-position:left center}
  .side-nav{padding:0 18px;display:flex;flex-direction:column;gap:4px;flex:1}
  .side-nav .label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);padding:0 14px 8px;font-weight:500}
  .side-nav a{position:relative;display:flex;align-items:center;gap:12px;color:var(--text);text-decoration:none;padding:11px 14px;border-radius:var(--r-sm);font-weight:500;font-size:14px;transition:background .18s var(--ease), color .18s var(--ease)}
  .side-nav a:hover{background:#f6f6f8;color:var(--ink)}
  .side-nav a.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
  .side-nav a.active::before{content:"";position:absolute;left:-18px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--primary)}
  .side-nav .spacer{flex:1}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{height:70px;background:rgba(255,255,255,.85);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);box-shadow:0 1px 0 var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:15;gap:12px}
  .topbar h1{font-size:15px;font-weight:500;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumbs{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumbs b{color:var(--ink);font-weight:500}
  .crumbs a{color:var(--muted);text-decoration:none;transition:color .15s} .crumbs a:hover{color:var(--primary)}
  .crumbs span{margin:0 8px;color:var(--line2)}
  .tb-right{display:flex;align-items:center;gap:14px}
  .date-pill{display:flex;align-items:center;gap:8px;background:#f6f6f8;color:var(--text);padding:8px 13px;border-radius:var(--r-sm);font-size:13px;font-weight:500;white-space:nowrap}
  .date-pill svg{width:15px;height:15px;color:var(--muted)}
  .bell{position:relative;background:#f6f6f8;border:none;color:var(--ink);width:38px;height:38px;border-radius:var(--r-sm);cursor:pointer;display:grid;place-items:center;transition:background .15s}
  .bell:hover{background:#eeeef2}
  .bell svg{width:19px;height:19px}
  .bell .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;background:var(--primary);border-radius:50%;border:2px solid #f6f6f8}
  .avatar{width:38px;height:38px;border-radius:var(--r-sm);background:linear-gradient(135deg,#c01c2c,#16181f);color:#fff;display:grid;place-items:center;font-weight:600;font-size:13px;cursor:pointer;transition:transform .15s var(--ease)}
  .avatar:hover{transform:translateY(-1px)}
  .content{padding:32px 32px 64px}
  .inner{max-width:1800px;margin:0 auto;animation:pageIn .3s var(--ease)}
  @keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- Page header & summary cards ---------- */
  .page-head{display:flex;align-items:center;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:24px}
  .page-head .titles{flex:1;min-width:220px}
  .page-head > h2{flex:1}
  .page-head h2{margin:0;font-size:26px;font-weight:600;color:var(--ink);letter-spacing:-.4px;line-height:1.25}
  .page-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
  .summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;margin-bottom:24px}
  .s-card{background:#fff;border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow);transition:transform .2s var(--ease), box-shadow .2s var(--ease)}
  .s-card.click{cursor:pointer}
  .s-card.click:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(16,24,40,.08)}
  .s-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .s-label{font-size:13.5px;color:var(--muted);font-weight:500}
  .s-icon{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
  .s-icon svg{width:19px;height:19px}
  .t-red{background:var(--primary-soft);color:var(--primary)}
  .t-ink{background:#f0f0f3;color:var(--ink)}
  .t-orange{background:#fdf2e4;color:var(--orange)}
  .t-green{background:#e6f5ec;color:var(--green)}
  .s-value{font-size:27px;font-weight:600;color:var(--ink);letter-spacing:-.5px;line-height:1.15}
  .s-value.loss{color:var(--red)}
  .s-foot{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--muted);min-height:22px}
  .trend{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
  .trend.good{background:#e6f5ec;color:var(--green)}
  .trend.bad{background:#fdecee;color:var(--red)}
  .trend.flat{background:#f0f0f3;color:var(--muted)}
  .c-blue{color:var(--primary)} .c-ink{color:var(--ink)} .c-orange{color:var(--orange)} .c-red{color:var(--red)} .c-green{color:var(--green)} .c-purple{color:var(--purple)}

  /* ---------- Cards, toolbars, buttons ---------- */
  .card{background:#fff;border-radius:var(--radius);margin-bottom:24px;box-shadow:var(--shadow);overflow:hidden}
  .card-head{padding:22px 24px 0;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .card-head h3{margin:0;font-size:16px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
  .card-body{padding:18px 24px 24px}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 24px}
  .toolbar .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .search{position:relative;width:320px;max-width:100%}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
  .search input{padding-left:38px;background:#f6f6f8;border-color:transparent}
  .search input:focus{background:#fff}
  .filter-panel{display:none;gap:12px;flex-wrap:wrap;padding:0 24px 16px;align-items:flex-end;animation:fadeIn .2s var(--ease)}
  .filter-panel.open{display:flex}
  .filter-panel > div{min-width:180px}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  input,select,textarea{font:inherit;font-size:13.5px;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-sm);background:#fff;color:var(--ink);width:100%;transition:border-color .15s, box-shadow .15s, background .15s}
  textarea{resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
  input[type=checkbox]{width:16px;height:16px;accent-color:var(--ink);cursor:pointer;padding:0}
  label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;font-weight:500}
  .field{margin-bottom:16px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}

  .btn{font:inherit;font-size:13.5px;cursor:pointer;border:1px solid transparent;border-radius:var(--r-sm);padding:9px 16px;font-weight:500;background:var(--primary);color:#fff;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;transition:background .15s, box-shadow .15s, transform .1s, border-color .15s, color .15s}
  .btn svg{width:16px;height:16px}
  .btn:hover{background:var(--primary-dark);box-shadow:0 4px 12px rgba(192,28,44,.22)}
  .btn:active{transform:translateY(1px)}
  .btn.lg{padding:11px 20px}
  .btn.outline{background:#fff;color:var(--ink);border-color:var(--line2)}
  .btn.outline:hover{background:#f8f8fa;border-color:#d6d7de;box-shadow:none}
  .btn.outline.on{border-color:var(--ink);color:var(--ink);background:#f6f6f8}
  .btn.soft{background:#f3f3f6;color:var(--ink)}
  .btn.soft:hover{background:var(--primary-soft);color:var(--primary);box-shadow:none}
  .btn.danger{background:#fdecee;color:var(--red)}
  .btn.danger:hover{background:#fadadd;box-shadow:none}
  .btn.ghost{background:none;color:var(--muted);padding:6px 8px}
  .btn.ghost:hover{background:#f3f3f6;color:var(--ink);box-shadow:none}
  .btn.sm{padding:6px 12px;font-size:12.5px}
  .btn.icon{width:44px;height:44px;padding:0;justify-content:center;flex-shrink:0}
  .btn.icon svg{width:19px;height:19px}
  [data-tip]{position:relative}
  @media (hover:hover){ [data-tip]:hover::after{content:attr(data-tip);position:absolute;top:calc(100% + 8px);right:0;background:var(--ink);color:#fff;font-size:12px;font-weight:500;padding:6px 10px;border-radius:7px;white-space:nowrap;z-index:25;pointer-events:none;animation:fadeIn .15s var(--ease)} }
  .page-head > [data-tip]:first-child:hover::after{right:auto;left:0}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none}

  .tabs{display:inline-flex;background:#ececf0;border-radius:11px;padding:4px;gap:2px;margin-bottom:24px}
  .tabs button{font:inherit;font-size:13.5px;font-weight:500;border:none;background:none;color:var(--muted);padding:8px 18px;border-radius:8px;cursor:pointer;transition:all .18s var(--ease)}
  .tabs button:hover{color:var(--ink)}
  .tabs button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(16,24,40,.1)}

  /* ---------- Tables ---------- */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:16px 14px;white-space:nowrap;vertical-align:middle;font-size:13.5px}
  th{background:#fafafb;color:var(--muted);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--line);user-select:none;padding-top:12px;padding-bottom:12px}
  th.sortable{cursor:pointer;transition:color .15s} th.sortable:hover{color:var(--ink)}
  th .arrow{display:inline-block;width:10px;margin-left:4px;font-size:9px;color:transparent;transition:color .15s}
  th.sortable:hover .arrow{color:var(--line2)}
  th.sorted{color:var(--ink)} th.sorted .arrow{color:var(--primary)}
  td{color:var(--text);border-bottom:1px solid var(--line);transition:background .15s}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover td{background:#fafafb}
  tr.sel td{background:#fff7f8}
  tr.flash td{animation:flash 1.6s var(--ease)}
  @keyframes flash{0%,30%{background:#fff1d6}100%{background:transparent}}
  th.cb,td.cb{width:44px;padding-right:0}
  th:first-child,td:first-child{padding-left:24px}
  th:last-child,td:last-child{padding-right:24px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  td.strong{color:var(--ink);font-weight:500}
  td a{color:var(--ink);text-decoration:none;font-weight:500;transition:color .15s} td a:hover{color:var(--primary)}
  .sub{font-size:12px;color:var(--muted)}
  .chip{display:inline-block;background:#f3f3f6;border-radius:6px;padding:3px 8px;font-size:11.5px;margin:2px 4px 2px 0;color:var(--text)}
  .status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:color-mix(in srgb, currentColor 10%, transparent)}
  .status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .dots{background:none;border:none;cursor:pointer;width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:16px;line-height:1;letter-spacing:1px;transition:background .15s, color .15s, opacity .15s}
  .dots:hover{background:#f0f0f3;color:var(--ink)}
  @media (hover:hover){ tbody tr .dots{opacity:0} tbody tr:hover .dots, .dots:focus{opacity:1} }
  .in{color:var(--green);font-weight:600} .out{color:var(--red);font-weight:600}
  .empty{color:var(--muted);text-align:center;padding:30px}
  .empty-state{text-align:center;padding:44px 24px}
  .empty-state .e-icon{width:56px;height:56px;border-radius:16px;background:#f3f3f6;color:var(--muted);display:grid;place-items:center;margin:0 auto 14px}
  .empty-state .e-icon svg{width:24px;height:24px}
  .empty-state .e-title{color:var(--ink);font-weight:500;font-size:14.5px}
  .empty-state .e-text{color:var(--muted);font-size:13px;margin-top:4px}
  .empty-state .btn{margin-top:16px}

  /* Pagination footer */
  .table-foot{padding:14px 24px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .table-foot b{color:var(--ink);font-weight:500}
  .pager{margin-left:auto;display:flex;align-items:center;gap:4px}
  .pager select{width:auto;padding:6px 10px;margin-right:8px;font-size:12.5px}
  .pager button{font:inherit;font-size:12.5px;min-width:32px;height:32px;border:none;background:none;border-radius:8px;cursor:pointer;color:var(--text);padding:0 8px;transition:background .15s}
  .pager button:hover:not(:disabled){background:#f3f3f6}
  .pager button.cur{background:var(--ink);color:#fff}
  .pager button:disabled{opacity:.35;cursor:default}
  .pager .gap{padding:0 4px}

  /* ---------- Dropdown menu ---------- */
  .menu{position:absolute;background:#fff;border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;min-width:180px;z-index:40;animation:pop .14s var(--ease);transform-origin:top right}
  @keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .menu button{display:block;width:100%;text-align:left;font:inherit;font-size:13.5px;border:none;background:none;padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--ink);transition:background .12s}
  .menu button:hover{background:#f6f6f8}
  .menu button.danger{color:var(--red)}
  .menu button.active{color:var(--primary);background:var(--primary-soft)}
  .menu .menu-title{font-size:11px;color:var(--muted);padding:8px 12px 4px;text-transform:uppercase;letter-spacing:.6px}
  .menu .alert{padding:8px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:16px}

  /* ---------- Point of sale ---------- */
  .pos-grid{display:grid;grid-template-columns:1.65fr 1fr;gap:24px;align-items:start}
  .pos-grid > *{min-width:0}
  .pos-side .card{margin-bottom:24px}
  @media (max-width:1100px){.pos-grid{grid-template-columns:1fr}}
  .cart-line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .cart-line .name{color:var(--ink);font-weight:500;font-size:13.5px}
  .cart-line input{width:64px;padding:7px 8px;text-align:center}
  .totals{margin:18px 0 20px}
  .totals .r{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:3px 0}
  .totals .grand{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:14px;color:var(--muted)}
  .totals .grand b{font-size:28px;color:var(--ink);font-weight:600;letter-spacing:-.5px}

  /* ---------- Sales chart ---------- */
  .chart-wrap{position:relative;padding:8px 24px 20px}
  .chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}
  .chart-wrap .bar-hit{cursor:pointer}
  .chart-wrap .bar-hit:hover + .bar-mark, .chart-wrap .bar-mark.hover{fill:var(--primary-dark)}
  .chart-tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;border-radius:8px;white-space:nowrap;opacity:0;transform:translate(-50%,-110%);transition:opacity .12s;box-shadow:var(--shadow-lg)}
  .chart-tip b{display:block;font-size:13px;font-weight:600}
  .chart-total{display:flex;align-items:baseline;gap:10px;padding:4px 24px 0}
  .chart-total b{font-size:22px;color:var(--ink);font-weight:600;letter-spacing:-.4px}

  /* ---------- Details / accounts ---------- */
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .acc-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px}
  @media (max-width:1100px){.acc-grid,.two-col{grid-template-columns:1fr}}
  .pl-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .pl-row:last-child{border-bottom:none}
  .pl-row > span:first-child{color:var(--muted)}
  .pl-row.total-row > span{font-weight:600;color:var(--ink);font-size:14.5px}
  .bar-row{margin-bottom:16px;font-size:13.5px}
  .bar{height:8px;background:#f0f0f3;border-radius:999px;overflow:hidden;margin-top:8px}
  .bar div{height:100%;border-radius:999px;transition:width .6s var(--ease)}
  .logo-upload{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo-preview{width:170px;height:68px;padding:8px;border-radius:12px;border:1px dashed var(--line2);display:grid;place-items:center;overflow:hidden;background:#fafafb;color:var(--muted);font-size:11px;flex-shrink:0}
  .logo-preview img{width:100%;height:100%;object-fit:contain}

  /* ---------- Modal, toast, receipt ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(16,18,26,.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:60px 14px;overflow:auto;z-index:50}
  .modal-bg.open{display:flex;animation:bgIn .2s ease}
  .modal-bg.open .modal{animation:modalIn .24s var(--ease)}
  @keyframes bgIn{from{opacity:0}to{opacity:1}}
  @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
  .modal{background:#fff;border-radius:18px;width:100%;max-width:560px;padding:28px;box-shadow:var(--shadow-lg)}
  .modal h3{margin:0 0 20px;font-size:18px;font-weight:600;color:var(--ink);letter-spacing:-.2px}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
  .checks{max-height:220px;overflow:auto;border:1px solid var(--line2);border-radius:var(--r-sm);padding:8px 12px}
  .checks .grp{font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:10px 0 4px}
  .checks label{display:flex;gap:8px;align-items:center;color:var(--ink);font-weight:400;font-size:13.5px;margin:5px 0}
  .toast{position:fixed;bottom:28px;left:50%;transform:translate(-50%,12px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:opacity .25s, transform .25s var(--ease);pointer-events:none;z-index:60;font-size:13.5px;white-space:nowrap;box-shadow:var(--shadow-lg)}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .receipt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:#fafafb;border-radius:12px;padding:20px;color:var(--ink)}
  .receipt .r{display:flex;justify-content:space-between;gap:10px}
  .receipt hr{border:none;border-top:1px dashed #d4d5dc;margin:10px 0}
  .receipt img{display:block;max-width:180px;max-height:56px;margin:0 auto 10px;object-fit:contain}
  .note{background:#fdf6ea;color:#8a5a00;padding:12px 16px;border-radius:12px;font-size:13px;margin-bottom:24px}


  /* ---------- Sign-in ---------- */

    radial-gradient(900px 500px at 15% -10%, #fbe3e6 0%, transparent 60%),

  .login-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}

  /* ---------- App bar (like the reference) ---------- */
  .topbar{background:#f0f0f2 !important;backdrop-filter:none !important;-webkit-backdrop-filter:none !important;box-shadow:none !important}
  .appbar-title{display:flex;align-items:center;gap:10px;min-width:0}

  .appbar-title h1{font-size:19px;font-weight:600;color:var(--ink);margin:0}

  .page-actions{display:flex;align-items:center;gap:8px;margin-right:6px}
  .page-actions .btn.icon{width:40px;height:40px}
  .page-actions .dd{padding:9px 13px}
  .icon-btn{position:relative;background:none;border:none;color:var(--ink);width:38px;height:38px;border-radius:var(--r-sm);cursor:pointer;display:grid;place-items:center;transition:background .15s, opacity .15s}

  .icon-btn.disabled{opacity:.3;cursor:not-allowed}
  .icon-btn.disabled:hover{background:none}
  .avatar{border:none;font:inherit;width:42px !important;height:42px !important;border-radius:50% !important;box-shadow:0 0 0 3px #fff, 0 2px 8px rgba(16,24,40,.15);font-size:14px !important}
  .side-nav a.disabled{opacity:.38;cursor:not-allowed}
  .side-nav a.disabled:hover{background:none;color:var(--text)}
  .user-card{padding:10px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:6px;min-width:230px}

  /* ---------- Records panel (like the reference) ---------- */
  .panel{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:24px}
  .panel-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:26px 28px 30px}
  .panel-head h2{flex:1;margin:0;font-size:22px;font-weight:600;color:var(--ink);letter-spacing:-.3px;min-width:200px}
  .panel-tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

  .dd .caret{width:14px;height:14px;stroke:var(--ink);fill:var(--ink);stroke-width:1}

  /* plain table: bold dark headers, row dividers, dot statuses */
  table.plain th{background:#fff;color:var(--ink);font-size:14px;font-weight:600;text-transform:none;letter-spacing:0;padding-top:14px;padding-bottom:16px;border-bottom:1px solid #e6e6ea;box-shadow:0 4px 6px -4px rgba(16,24,40,.12)}

  table.plain th:last-child, table.plain td:last-child{padding-right:28px}
  table.plain td{padding-top:17px;padding-bottom:17px;border-bottom-color:#ececf0}
  table.plain .status{background:none;padding:0;font-weight:500;font-size:13.5px}
  .who{display:inline-flex;align-items:center;gap:12px}
  .av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11.5px;font-weight:600;flex-shrink:0;letter-spacing:.3px}

  /* ---------- Inventory browser ---------- */
  .inv-nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;overflow:visible}

  .inv-path b{color:var(--ink);font-weight:600;font-size:16px}

  .inv-nav .search{width:340px}
  .inv-nav.top .search{flex:1;width:auto}
  .inv-nav.top .search input{height:46px;font-size:14.5px}
  .bc-av.has-logo{background:#fff;box-shadow:inset 0 0 0 1px var(--line);padding:5px}

  .brand-logo-prev{width:84px;height:84px;border-radius:14px;border:1px dashed var(--line2);background:#fafafb;display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:11px;text-align:center;flex-shrink:0;padding:8px}

  .seg{display:inline-flex;background:#ececf0;border-radius:10px;padding:3px;gap:2px}

  .brand-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin-bottom:24px;animation:fadeIn .25s var(--ease)}

  tr.clickable{cursor:pointer}
  .head-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  b.ink{color:var(--ink);font-weight:600}


  /* ---------- Point of sale (Dashboard) ---------- */
  .stat-strip{display:flex;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
  .ss{flex:1;display:flex;align-items:baseline;gap:10px;padding:16px 22px;border:none;background:none;font:inherit;text-align:left;border-right:1px solid var(--line);min-width:0;flex-wrap:wrap}
  .ss:last-child{border-right:none}

  .ss b{font-size:19px;color:var(--ink);font-weight:600;letter-spacing:-.3px}
  .ss-link{cursor:pointer;transition:background .15s}
  .ss-link:hover{background:#fafafb}

  .ss-go{margin-left:auto;font-size:12.5px;color:var(--muted)}
  .pos-layout{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(340px,1fr);gap:24px;align-items:start}
  .pos-side{position:sticky;top:94px}
  .pos-side .card{margin-bottom:0}
  .pos-find{padding:20px 22px 24px;overflow:visible}
  .pos-search{position:relative}
  .pos-search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
  .pos-search input{height:54px;padding-left:48px;font-size:15px;border-radius:12px;background:#f6f6f8;border-color:transparent}
  .pos-search input:focus{background:#fff}
  .pos-search input{padding-right:190px}
  .enter-hint{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);background:#fff;border:1px solid var(--line2);border-radius:6px;padding:3px 8px;pointer-events:none}
  .pos-filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .pos-filters select{width:auto;min-width:170px}
  .pos-filters select:disabled{background:#f6f6f8;color:var(--muted)}
  .switch{display:inline-flex;align-items:center;gap:8px;margin:0 0 0 auto;color:var(--text);font-size:13px;font-weight:400;cursor:pointer;user-select:none}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch span{width:34px;height:20px;border-radius:999px;background:#dcdde3;position:relative;transition:background .18s}
  .switch span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .18s var(--ease)}
  .switch input:checked + span{background:var(--ink)}
  .switch input:checked + span::after{transform:translateX(14px)}
  .switch input:focus-visible + span{box-shadow:0 0 0 3px var(--primary-soft)}
  .pos-quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}
  .pq-label{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.6px;margin-right:4px}
  .pq-chip{font:inherit;font-size:13px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:#fff;color:var(--ink);padding:6px 12px 6px 9px;border-radius:999px;cursor:pointer;transition:all .15s}
  .pq-chip svg{width:14px;height:14px;color:var(--primary)}
  .pq-chip:hover{border-color:var(--primary);background:var(--primary-soft)}
  .pq-chip:disabled{opacity:.4;cursor:not-allowed}
  .pos-count{font-size:12.5px;color:var(--muted);margin:18px 0 10px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
  .tile{position:relative;font:inherit;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:118px;padding:14px 14px 12px;border-radius:12px;border:1px solid var(--line2);background:#fff;cursor:pointer;transition:border-color .15s, box-shadow .15s, transform .1s}

  .tile:active:not(:disabled){transform:scale(.98)}
  .tile:disabled{cursor:not-allowed;opacity:.5;background:#fafafb}
  .tile.in-cart{border-color:var(--primary);background:#fffafb}
  .tile.flash{animation:flash 1.6s var(--ease)}
  .t-name{color:var(--ink);font-weight:500;font-size:13.5px;line-height:1.35;padding-right:22px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .t-sku{font-size:11.5px;color:var(--muted)}
  .t-foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
  .t-foot b{color:var(--ink);font-size:15px;font-weight:600}
  .t-stock{font-size:11.5px;color:var(--green)}
  .t-stock.low{color:var(--orange)} .t-stock.out{color:var(--red)}
  .t-badge{position:absolute;top:10px;right:10px;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--primary);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;animation:pop .18s var(--ease)}
  .cart-lines{max-height:min(42vh,380px);overflow:auto;margin:0 -4px;padding:0 4px}

  .cl-info{flex:1;min-width:0}

  .stepper span{min-width:28px;text-align:center;font-weight:600;font-size:13.5px;color:var(--ink)}
  .cl-total{width:88px;text-align:right;font-weight:600;color:var(--ink);font-size:13.5px;flex-shrink:0}
  .cl-remove{border:none;background:none;color:#b5b7c0;cursor:pointer;width:26px;height:26px;border-radius:7px;flex-shrink:0}
  .cl-remove:hover{background:#fdecee;color:var(--red)}
  .pay-label{font-size:12.5px;color:var(--muted);font-weight:500;margin-bottom:8px}
  .pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  .pay-btn{font:inherit;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;padding:11px 12px;border-radius:10px;border:1px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer;transition:all .15s}
  .pay-btn svg{width:17px;height:17px;color:var(--muted)}
  .pay-btn:hover{border-color:#cfd0d7}
  .pay-btn.active{border-color:var(--ink);background:var(--ink);color:#fff}
  .pay-btn.active svg{color:#fff}
  .cash-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
  .change{min-width:130px;padding:9px 12px;border-radius:9px;background:#f6f6f8;display:flex;flex-direction:column;gap:1px}
  .change span{font-size:11.5px;color:var(--muted)}
  .change b{font-size:15px;color:var(--ink)}
  .change.ok{background:#e9f6ee} .change.ok b{color:var(--green)}
  .change.short{background:#fdecee} .change.short b{color:var(--red)}
  .cust{margin-bottom:12px}
  .cust .btn svg{width:15px;height:15px}
  .btn.complete{width:100%;justify-content:center;height:52px;font-size:15px;font-weight:600;gap:10px}
  .kbd{font-size:11px;font-weight:500;opacity:.7;border:1px solid rgba(255,255,255,.4);border-radius:5px;padding:1px 6px}
  .sale-bar{display:none}
  .chart-wrap svg{max-height:260px}
  @media (max-width:1100px){ .pos-layout{grid-template-columns:1fr} .pos-side{position:static} .stat-strip{flex-wrap:wrap} .ss{flex:1 1 45%;border-bottom:1px solid var(--line)} }

    .toast{bottom:84px}

    .pos-find{padding:14px}
    .pos-search input{height:48px;font-size:14px}
    .pos-filters select{flex:1 1 40%;min-width:0}
    .switch{flex-basis:100%}
    .enter-hint{display:none}
    .pos-search input{padding-right:14px}
    .switch{margin-left:0}
    .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

    .kbd{display:none}

    .sale-bar b{font-weight:600}
    .content{padding-bottom:90px}

    .appbar-title h1{font-size:17px}
    .inv-nav .search{width:100%;order:3}
    .inv-nav.top .search{order:0;flex:1;width:auto}
    .bc-av.has-logo{width:52px;height:52px}
    .brand-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .brand-card{padding:16px;min-height:150px}
    .bc-av{width:44px;height:44px;margin-bottom:10px}
    .page-actions{margin-right:0;gap:6px}

    .appbar-title .crumbs{display:none}

<body>
<div class="login" id="login" style="display:none">
  <form class="login-card" id="loginForm" autocomplete="on">
    <img class="login-logo" id="loginLogo" alt="Leiden Investment Limited">
    <h2>Welcome back</h2>
    <p class="login-sub">Sign in to continue to the parts &amp; sales system.</p>

const DEFAULT_NAME = 'Leiden Investment Limited';
// Default administrator: admin@gmail.com / 12345678 (only a SHA-256 hash is stored)
const DEFAULT_ADMIN = {id:'u1', name:'Administrator', email:'admin@gmail.com', role:'admin', builtin:true,
  passHash:'9c21d82ad5e6a5068c6be73bcb5f4cd54e74018a64c3d21a1fd91e61832aa552'};
const DEFAULT_SETTINGS = {currency:'K', vat:0, receiptFooter:'Thank you for your business!', defaultReorder:5, logo:''};
let memoryFallback = null;

// A fresh start: no brands, parts or sales — only the default administrator
function seedData(){
  const now = new Date().toISOString();
  return {users:[{...DEFAULT_ADMIN, created:now}], shopName:DEFAULT_NAME, settings:{...DEFAULT_SETTINGS},
    brands:[], models:[], parts:[], sales:[], movements:[], expenses:[], seq:100, demoCleared:true};
}

// Makes sure older saved data has every field the app now uses
function migrate(d){
  d.shopName = (!d.shopName || d.shopName === 'PartsPro' || d.shopName === 'Main Shop') ? DEFAULT_NAME : d.shopName;
  d.settings = Object.assign({...DEFAULT_SETTINGS}, d.settings || {});
  if(!d.users || !d.users.length) d.users = [{...DEFAULT_ADMIN, created:new Date().toISOString()}];
  d.brands = d.brands || []; d.models = d.models || []; d.parts = d.parts || [];
  d.sales = d.sales || []; d.movements = d.movements || []; d.expenses = d.expenses || [];
  d.parts.forEach(p => { if(p.cost === undefined) p.cost = 0; });
  // one-time removal of the old sample data (users and settings are kept)
  if(!d.demoCleared){
    Object.assign(d, {brands:[], models:[], parts:[], sales:[], movements:[], expenses:[], demoCleared:true});
    try{ localStorage.removeItem('hardware_pm_cart'); }catch(e){}
  }
  return d;
}
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){}
  return memoryFallback || seedData();
}
function save(){
  memoryFallback = db;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); return true; }
  catch(e){ toast('Could not save — browser storage is full'); return false; }
}
let db = load();
save();

function newId(prefix){ db.seq = (db.seq||100) + 1; return prefix + db.seq; }
function logMovement(part, type, qty, ref=''){
  db.movements.push({id:newId('mv'), date:new Date().toISOString(), partId:part.id, name:part.name, sku:part.sku, type, qty, cost:part.cost, ref, by: currentUser ? currentUser.name : ''});
}

/* ============================================================
   HELPERS
   ============================================================ */
const $ = sel => document.querySelector(sel);
const cur = () => db.settings.currency || 'K';
const money = n => (n < 0 ? '-' : '') + cur() + ' ' + Math.abs(Number(n||0)).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2});
const round2 = n => Math.round(n * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brandById = id => db.brands.find(b => b.id === id);
const modelById = id => db.models.find(m => m.id === id);
const partById  = id => db.parts.find(p => p.id === id);
const modelLabel = m => { const b = brandById(m.brandId); return (b ? b.name + ' ' : '') + m.name; };
const fmtDate = iso => new Date(iso).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const sameDay = (a,b) => a.toDateString() === b.toDateString();
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayStr = () => ymd(new Date());
const itemCost = i => i.cost !== undefined ? i.cost : ((partById(i.partId)||{}).cost || 0);
const moveCost = m => m.cost !== undefined ? m.cost : ((partById(m.partId)||{}).cost || 0);
const saleNet = s => s.subtotal !== undefined ? s.subtotal : s.total;   // income excluding VAT
const partLink = (id, name) => partById(id) ? `<a href="#part-${id}">${esc(name)}</a>` : esc(name);

// "Today - 4:20 pm" style dates
function niceDate(iso){
  const d = new Date(iso), now = new Date(), y = new Date(); y.setDate(now.getDate()-1);
  const t = d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}).toLowerCase();
  if(sameDay(d,now)) return 'Today - ' + t;
  if(sameDay(d,y)) return 'Yesterday - ' + t;
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}) + ' - ' + t;
}
function niceDay(s){
  const d = new Date(s + 'T12:00:00');
  if(sameDay(d,new Date())) return 'Today';
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
}

/* ---------- Dropdown menu ---------- */
let menuEl = null;
function closeMenu(){ if(menuEl){ menuEl.remove(); menuEl = null; } }
document.addEventListener('click', closeMenu);

// items: [{label, fn, danger, active}] or {title} or {html}
function openMenu(e, items){
  e.stopPropagation(); closeMenu();
  const m = document.createElement('div'); m.className = 'menu';
  items.forEach(it => {
    if(it.title){ const t = document.createElement('div'); t.className='menu-title'; t.textContent = it.title; m.appendChild(t); return; }
    if(it.html){ const h = document.createElement('div'); h.innerHTML = it.html; m.appendChild(h); return; }
    const b = document.createElement('button'); b.textContent = it.label;
    if(it.danger) b.className = 'danger'; if(it.active) b.className = 'active';
    b.onclick = ev => { ev.stopPropagation(); closeMenu(); it.fn(); };
    m.appendChild(b);
  });
  m.addEventListener('click', ev => ev.stopPropagation());
  document.body.appendChild(m);
  const r = e.currentTarget.getBoundingClientRect();
  let left = Math.max(8, Math.min(r.right - m.offsetWidth, window.innerWidth - m.offsetWidth - 8));
  let top = r.bottom + 6 + window.scrollY;
  if(r.bottom + m.offsetHeight + 10 > window.innerHeight) top = r.top - m.offsetHeight - 6 + window.scrollY;
  m.style.left = left + 'px'; m.style.top = top + 'px';
  menuEl = m;
}

const CARD_ICONS = {'Sales Today':'cart','Items Sold':'box','Low Stock':'alert','Spare Parts':'box','Stock Value':'coins',
  'Brands':'tag','Models':'car','Unlinked Parts':'link','Total Sales':'cart','Receipts':'receipt','Units Sold':'box',
  'Stock Entries':'inbox','Units Received':'inbox','Stock Cost':'coins','Sales Income':'up','Expenses':'wallet',

// trend pill: change vs previous period ("up is good" unless goodUp is false)
function trendHTML(t){
  if(!t || (t.prev === 0 && t.cur === 0)) return '';
  const goodUp = t.goodUp !== false;
  if(t.prev === 0) return `<span class="trend ${t.cur > 0 === goodUp ? 'good' : 'bad'}">New</span>`;
  const pct = (t.cur - t.prev) / Math.abs(t.prev) * 100;
  if(Math.abs(pct) < 0.5) return '<span class="trend flat">0%</span>';
  const good = (pct > 0) === goodUp;
  return `<span class="trend ${good?'good':'bad'}" title="vs ${esc(t.label||'previous period')}">${pct>0?'↑':'↓'} ${Math.abs(pct).toFixed(Math.abs(pct)<10?1:0)}%</span>`;
}
function summaryCards(cards){
  return `<div class="summary-cards">${cards.map(c => {
    const tone = CARD_TONES[c.color] || c.color;
    const value = String(c.value).replace(/^Total /,'');
    return `<div class="s-card ${c.onclick?'click':''}" ${c.onclick?`onclick="${c.onclick}"`:''}>
      <div class="s-head"><span class="s-label">${esc(c.title)}</span><span class="s-icon t-${tone}">${ICON[CARD_ICONS[c.title]||'chart']}</span></div>
      <div class="s-value ${c.color==='loss'?'loss':''}">${value}</div>
      <div class="s-foot">${trendHTML(c.trend) ? `${trendHTML(c.trend)}<span>vs ${esc(c.trend.label)}</span>` : `<span>${esc(c.period||'')}</span>`}</div>
    </div>`;
  }).join('')}</div>`;
}

}

/* ---------- Date ranges ---------- */
const DATE_LABELS = {all:'Date', today:'Today', week:'This week', month:'This month', last:'Last month', custom:'Custom'};
const periodName = r => r === 'all' ? 'All time' : DATE_LABELS[r];
function rangeOf(st){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  if(st.range === 'today') return {from:todayStr(), to:todayStr()};
  if(st.range === 'week'){ const d = new Date(now); d.setDate(now.getDate() - ((now.getDay()+6)%7)); return {from:ymd(d), to:todayStr()}; }
  if(st.range === 'month') return {from:ymd(new Date(y,m,1)), to:ymd(new Date(y,m+1,0))};
  if(st.range === 'last')  return {from:ymd(new Date(y,m-1,1)), to:ymd(new Date(y,m,0))};
  if(st.range === 'custom') return {from:st.from||'', to:st.to||''};
  return {from:'', to:''};
}
// The period just before the selected one (for trend comparisons)
function prevRangeOf(st){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth();
  const day = s => new Date(s + 'T12:00:00');
  if(st.range === 'all') return null;
  if(st.range === 'month') return {from:ymd(new Date(y,m-1,1)), to:ymd(new Date(y,m,0)), label:'last month'};
  if(st.range === 'last')  return {from:ymd(new Date(y,m-2,1)), to:ymd(new Date(y,m-1,0)), label:'the month before'};
  const r = rangeOf(st); if(!r.from || !r.to) return null;
  const len = Math.round((day(r.to) - day(r.from)) / 864e5) + 1;
  const f = day(r.from); f.setDate(f.getDate() - len);
  const t = day(r.from); t.setDate(t.getDate() - 1);
  return {from:ymd(f), to:ymd(t), label: st.range==='today' ? 'yesterday' : st.range==='week' ? 'last week' : 'previous period'};
}
function inRange(iso, r){
  const d = new Date(iso);
  if(r.from && d < new Date(r.from + 'T00:00:00')) return false;
  if(r.to && d > new Date(r.to + 'T23:59:59')) return false;
  return true;
}
function dateMenu(e, key){
  const st = STATE[key];
  openMenu(e, [{title:'Show records from'}, ...Object.keys(DATE_LABELS).map(k => ({
    label: k==='all' ? 'All time' : k==='custom' ? 'Custom dates…' : DATE_LABELS[k],
    active: st.range === k,
    fn: () => { if(k === 'custom'){ customDates(key); return; } st.range = k; st.page = 1; route(); }
  }))]);
}
function customDates(key){

/* ============================================================
   TABLE ENGINE  — sorting, pagination, selection, mobile cards
   ============================================================ */
const mk = extra => Object.assign({q:'', open:false, page:1, size:10, sort:null, sel:new Set()}, extra);
const STATE = {
  parts:     mk({model:'', stock:''}),
  models:    mk({brand:''}),
  sales:     mk({range:'all', from:'', to:'', pay:''}),
  stock:     mk({range:'all', from:'', to:'', type:''}),
  exp:       mk({range:'month', from:'', to:'', cat:''}),
  ana:       mk({range:'month', from:'', to:''}),
  top:       mk({size:10}),
  users:     mk({}),
  partSales: mk({size:5}),
  partStock: mk({size:5})
};
const TABLES = {};
const flashIds = new Set();   // rows to highlight briefly after their stock changed
function flash(ids){ ids.forEach(id => flashIds.add(id)); clearTimeout(flash._t); flash._t = setTimeout(() => flashIds.clear(), 1800); }     // key -> function returning table config
const VISIBLE = {};    // key -> ids on the current page

/* Config: {rows, id(row), columns:[{key,label,html(row),sort(row),num,cls,first}], checkbox, actions(row), empty, rowClass(row)} */
function drawTable(key){
  const el = $('#tb_' + key); if(!el) return;
  const cfg = TABLES[key](), st = STATE[key];
  let rows = cfg.rows.slice();
  if(st.sort){
    const col = cfg.columns.find(c => c.key === st.sort.col);
    if(col && col.sort) rows.sort((a,b) => {
      const x = col.sort(a), y = col.sort(b);
      return (typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), undefined, {numeric:true})) * st.sort.dir;
    });
  }
  const total = rows.length, pages = Math.max(1, Math.ceil(total / st.size));
  if(st.page > pages) st.page = pages;
  const start = (st.page - 1) * st.size, pageRows = rows.slice(start, start + st.size);
  VISIBLE[key] = pageRows.map(cfg.id);

  if(!total){ el.innerHTML = emptyState(cfg.emptyIcon || 'search', cfg.empty || 'Nothing to show', cfg.emptyText, cfg.emptyAction); $('#tf_'+key).innerHTML = ''; if(cfg.bulk) cfg.bulk(); return; }

  const allSel = VISIBLE[key].length && VISIBLE[key].every(id => st.sel.has(id));
  const head = `<tr class="head">
    ${cfg.checkbox ? `<th class="cb"><input type="checkbox" ${allSel?'checked':''} onclick="event.stopPropagation();toggleAll('${key}', this.checked)" title="Select this page"></th>` : ''}
    ${cfg.columns.map(c => {
      const sorted = st.sort && st.sort.col === c.key;
      const arrow = sorted ? (st.sort.dir > 0 ? '▲' : '▼') : '▲';
      return `<th class="${c.num?'num':''} ${c.sort?'sortable':''} ${sorted?'sorted':''}" ${c.sort?`onclick="sortBy('${key}','${c.key}')"`:''}>${esc(c.label)}${c.sort?`<span class="arrow">${arrow}</span>`:''}</th>`;
    }).join('')}
    ${cfg.actions ? '<th class="num">Action</th>' : ''}</tr>`;
  const body = pageRows.map(r => {
    const id = cfg.id(r);
    return `<tr class="${st.sel.has(id)?'sel':''} ${flashIds.has(id)?'flash':''} ${cfg.rowClick?'clickable':''}" ${cfg.rowClick ? `onclick="${cfg.rowClick(r)}"` : ''}>
      ${cfg.checkbox ? `<td class="cb" onclick="event.stopPropagation()"><input type="checkbox" ${st.sel.has(id)?'checked':''} onclick="event.stopPropagation();toggleSel('${key}','${esc(id)}',this.checked)"></td>` : ''}
      ${cfg.columns.map((c,i) => `<td data-label="${esc(c.label)}" class="${c.num?'num':''} ${c.cls||''} ${i===0?'first':''}">${c.html(r)}</td>`).join('')}
      ${cfg.actions ? `<td class="num act">${cfg.actions(r)}</td>` : ''}
    </tr>`;
  }).join('');
  el.innerHTML = `<table class="rt ${cfg.tableClass||''}">${head}${body}</table>`;

  // footer: counts + pager
  const btns = [];
  const addPage = n => btns.push(`<button class="${n===st.page?'cur':''}" onclick="setPage('${key}',${n})">${n}</button>`);
  let lo = Math.max(1, st.page - 2), hi = Math.min(pages, lo + 4); lo = Math.max(1, hi - 4);
  if(lo > 1){ addPage(1); if(lo > 2) btns.push('<span class="gap">…</span>'); }
  for(let n = lo; n <= hi; n++) addPage(n);
  if(hi < pages){ if(hi < pages - 1) btns.push('<span class="gap">…</span>'); addPage(pages); }
  const selCount = [...st.sel].length;
  $('#tf_'+key).innerHTML = `<div class="table-foot">
    <span>Showing <b>${start+1}–${start+pageRows.length}</b> of <b>${total}</b></span>
    ${cfg.checkbox && selCount ? `<span>Selected <b>${selCount}</b></span>` : ''}
    ${cfg.footer ? cfg.footer(rows) : ''}
    <div class="pager">
      <select onchange="setPageSize('${key}', this.value)" title="Rows per page">${[5,8,10,25,50].filter(n => n>=5).map(n=>`<option value="${n}" ${n===st.size?'selected':''}>${n} / page</option>`).join('')}</select>
      <button ${st.page<=1?'disabled':''} onclick="setPage('${key}',${st.page-1})" title="Previous">‹</button>
      ${btns.join('')}
      <button ${st.page>=pages?'disabled':''} onclick="setPage('${key}',${st.page+1})" title="Next">›</button>
    </div></div>`;
  if(cfg.bulk) cfg.bulk();
}
function emptyState(icon, title, text, action){
  return `<div class="empty-state"><div class="e-icon">${ICON[icon] || ICON.search}</div>
    <div class="e-title">${esc(title)}</div>${text ? `<div class="e-text">${esc(text)}</div>` : ''}${action || ''}</div>`;
}
function sortBy(key, col){
  const st = STATE[key];
  if(st.sort && st.sort.col === col){ if(st.sort.dir === 1) st.sort.dir = -1; else st.sort = null; }
  else st.sort = {col, dir:1};
  drawTable(key);
}
function setPage(key, n){ STATE[key].page = n; drawTable(key); }
function setPageSize(key, n){ STATE[key].size = parseInt(n); STATE[key].page = 1; drawTable(key); }
function toggleSel(key, id, on){ on ? STATE[key].sel.add(id) : STATE[key].sel.delete(id); drawTable(key); }
function toggleAll(key, on){ (VISIBLE[key]||[]).forEach(id => on ? STATE[key].sel.add(id) : STATE[key].sel.delete(id)); drawTable(key); }
function toggleFilter(key){ STATE[key].open = !STATE[key].open; route(); }
function bindSearch(key){
  const el = $('#q_'+key); if(!el) return;
  el.oninput = e => { STATE[key].q = e.target.value; STATE[key].page = 1; drawTable(key); };
}
function bindFilter(selector, key, field, rerender){
  const el = $(selector); if(!el) return;
  el.onchange = e => { STATE[key][field] = e.target.value; STATE[key].page = 1; rerender ? route() : drawTable(key); };
}

/* ---------- Export (copies CSV) ---------- */
function exportCSV(name, header, rows){
  const csv = [header, ...rows].map(r => r.map(v => {
    const s = String(v ?? ''); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  }).join(',')).join('\n');
  const done = () => toast(`${rows.length} row(s) copied as CSV — paste into Excel or Sheets`);
  const fallback = () => openModal(`<h3>Export ${esc(name)}</h3><p class="sub" style="margin-top:0">Copy this and paste it into Excel or Google Sheets.</p>
      <textarea rows="10" style="font-family:monospace;font-size:12px" onclick="this.select()">${esc(csv)}</textarea>
      <div class="modal-actions"><button class="btn" onclick="closeModal()">Done</button></div>`);
  try{ navigator.clipboard.writeText(csv).then(done, fallback); }catch(e){ fallback(); }
}
const pickRows = (key, list, idOf) => { const s = STATE[key].sel; const chosen = list.filter(x => s.has(idOf(x))); return chosen.length ? chosen : list; };

function addToCart(id){
  const p = partById(id), line = cart.find(c=>c.partId===id);
  const qty = (line ? line.qty : 0) + 1;
  if(qty > p.stock) return toast(p.stock <= 0 ? 'Out of stock' : `Only ${p.stock} in stock`);
  if(line) line.qty = qty; else cart.push({partId:id, qty:1});
  saveCart(); drawCart(); drawTiles();
}
function changeQty(id, d){
  const p = partById(id), line = cart.find(c=>c.partId===id); if(!line) return;
  const q = line.qty + d;
  if(q > p.stock) return toast(`Only ${p.stock} in stock`);
  if(q <= 0) cart = cart.filter(c => c.partId !== id); else line.qty = q;
  saveCart(); drawCart(); drawTiles();
}
function removeLine(id){ cart = cart.filter(c => c.partId !== id); saveCart(); drawCart(); drawTiles(); }
function clearSale(){ cart = []; sale = {pay:sale.pay, received:'', customer:'', phone:'', showCustomer:false}; saveCart(); drawCart(); drawTiles(); }
function setPay(p){ sale.pay = p; if(p !== 'Cash') sale.received = ''; saveCart(); drawCart(); }
function cartTotals(){
  const subtotal = round2(cart.reduce((a,c)=>a + partById(c.partId).price*c.qty, 0));
  const vat = round2(subtotal * (Number(db.settings.vat)||0) / 100);
  return {subtotal, vat, total: round2(subtotal + vat)};
}

        </div>` : ''}
      <div class="cust">

function drawSaleBar(t, units){

  bar.className = 'sale-bar' + (units ? ' show' : '');

// Ctrl/Cmd + Enter completes the sale from anywhere on the Dashboard
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter' && currentView === 'dashboard' && !$('#modalBg').classList.contains('open') && cart.length){
    const btn = $('#cartBox .complete'); if(btn && !btn.disabled){ e.preventDefault(); checkout(); }

function checkout(){
  if(!cart.length) return;
  for(const c of cart){
    const p = partById(c.partId);
    if(!p || c.qty > p.stock) return toast(`Not enough stock for ${p ? p.name : 'a part'}`);
  }
  const id = String(db.sales.length + 1).padStart(5,'0');
  const t = cartTotals();
  const rec = parseFloat(sale.received), hasRec = sale.pay === 'Cash' && sale.received !== '' && !isNaN(rec);
  if(hasRec && rec < t.total) return toast('Amount received is less than the total');
  const items = cart.map(c => { const p = partById(c.partId); return {partId:p.id, sku:p.sku, name:p.name, price:p.price, cost:p.cost, qty:c.qty}; });
  items.forEach(i => { const p = partById(i.partId); p.stock -= i.qty; logMovement(p, 'Sale', -i.qty, 'Receipt #' + id); });
  const record = {
    id, date: new Date().toISOString(), items,
    subtotal:t.subtotal, vat:t.vat, vatRate:Number(db.settings.vat)||0, total:t.total,
    payment: sale.pay, customer: sale.customer.trim(), phone: sale.phone.trim(), by: currentUser.name,
    ...(hasRec ? {received:round2(rec), change:round2(rec - t.total)} : {})
  };
  db.sales.push(record); save();
  cart = []; sale = {pay:'Cash', received:'', customer:'', phone:'', showCustomer:false}; saveCart();
  flash(items.map(i => i.partId));
  posFind.q = '';
  route();
  openModal(`<h3>Sale complete ✓</h3>${receiptHTML(record)}
    <div class="modal-actions"><button class="btn" id="newSaleBtn" onclick="closeModal();$('#posQ')&&$('#posQ').focus()">New Sale</button></div>`);
  setTimeout(() => $('#newSaleBtn') && $('#newSaleBtn').focus(), 50);
}

/* ---------- Sales chart: last 7 days (single series bar chart) ---------- */
function drawSalesChart(){
  const days = [];
  for(let n = 6; n >= 0; n--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - n);
    const list = db.sales.filter(s => sameDay(new Date(s.date), d));
    days.push({d, total:list.reduce((a,s)=>a+s.total,0), count:list.length});
  }
  const total = days.reduce((a,x)=>a+x.total,0);
  const W = 360, H = 170, padL = 8, padR = 8, padT = 14, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const max = Math.max(...days.map(x=>x.total));
  // nice top value for gridlines
  const step = max > 0 ? Math.pow(10, Math.floor(Math.log10(max))) : 1;
  const top = max > 0 ? Math.ceil(max / step) * step : 1;
  const slot = plotW / days.length, bw = Math.min(26, slot - 14);
  const y = v => padT + plotH - (v / top) * plotH;
  const grid = [0, .5, 1].map(f => `<line x1="${padL}" x2="${W-padR}" y1="${y(top*f)}" y2="${y(top*f)}" stroke="#efeff3" stroke-width="1" ${f===0?'':'stroke-dasharray="3 4"'}/>`).join('');
  const bars = days.map((x,i) => {
    const cx = padL + slot*i + slot/2, h = x.total > 0 ? Math.max(3, plotH - (y(x.total) - padT)) : 0;
    const isToday = i === days.length - 1;
    const label = x.d.toLocaleDateString(undefined,{weekday:'short'});
    // rounded top (4px), flat at the baseline
    const r = Math.min(4, h), x0 = cx - bw/2, y0 = padT + plotH - h;
    const path = h ? `M${x0},${padT+plotH} V${y0+r} Q${x0},${y0} ${x0+r},${y0} H${x0+bw-r} Q${x0+bw},${y0} ${x0+bw},${y0+r} V${padT+plotH} Z` : '';
    return `<rect class="bar-hit" x="${cx - slot/2}" y="${padT}" width="${slot}" height="${plotH}" fill="transparent"
        data-i="${i}" onmouseenter="chartTip(event,${i})" onmousemove="chartTip(event,${i})" onmouseleave="chartTip(null)"></rect>
      ${path ? `<path class="bar-mark" d="${path}" fill="${isToday ? 'var(--primary)' : '#e9a3aa'}" pointer-events="none"/>` : ''}
      <text x="${cx}" y="${H-6}" text-anchor="middle" font-size="11" fill="${isToday ? '#16181f' : '#8b8f9c'}" font-weight="${isToday?600:400}">${isToday ? 'Today' : label}</text>`;
  }).join('');
  chartDays = days;
  $('#chartBox').innerHTML = `
    <div class="card-head"><h3>Last 7 Days</h3><span class="sub">Daily sales</span></div>
    <div class="chart-total"><b>${money(total)}</b><span class="sub">${days.reduce((a,x)=>a+x.count,0)} receipt(s)</span></div>
    <div class="chart-wrap" id="chartWrap">
      <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart of daily sales for the last 7 days">${grid}${bars}</svg>
      <div class="chart-tip" id="chartTip"></div>
      <table class="sr-only"><caption>Daily sales, last 7 days</caption><tr><th>Day</th><th>Sales</th></tr>
        ${days.map(x=>`<tr><td>${x.d.toDateString()}</td><td>${money(x.total)}</td></tr>`).join('')}</table>
    </div>`;
}
let chartDays = [];
function chartTip(e, i){
  const tip = $('#chartTip'); if(!tip) return;
  document.querySelectorAll('#chartWrap .bar-mark.hover').forEach(m => m.classList.remove('hover'));
  if(!e){ tip.style.opacity = 0; return; }
  const x = chartDays[i], wrap = $('#chartWrap').getBoundingClientRect();
  const mark = e.target.nextElementSibling; if(mark && mark.classList.contains('bar-mark')) mark.classList.add('hover');
  tip.innerHTML = `<b>${money(x.total)}</b>${x.d.toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'short'})} · ${x.count} receipt(s)`;
  const r = e.target.getBoundingClientRect();
  tip.style.left = (r.left + r.width/2 - wrap.left) + 'px';
  tip.style.top = (e.clientY - wrap.top - 6) + 'px';
  tip.style.opacity = 1;
}

/* ============================================================
   INVENTORY  — browse Brands → Models → Parts, or see all parts in a list
   ============================================================ */
const GENERAL = 'general';
let invNav = {brand:null, model:null};   // brand: null | 'general' | brand id
let invView = 'browse';                  // 'browse' (grid → list → list) | 'list' (all parts)
const invLevel = () => invNav.model ? 'model' : invNav.brand === GENERAL ? 'general' : invNav.brand ? 'brand' : 'brands';
function resetInvTables(){ STATE.parts.page = 1; STATE.parts.sel.clear(); STATE.models.page = 1; }
function openBrand(id){ invView = 'browse'; invNav = {brand:id, model:null}; STATE.parts.q = ''; resetInvTables(); route(); }
function openModel(id){ const m = modelById(id); invView = 'browse'; invNav = {brand:m.brandId, model:id}; STATE.parts.q = ''; resetInvTables(); route(); }
function invBack(){ if(invNav.model) invNav.model = null; else invNav.brand = null; resetInvTables(); route(); }
function invHome(){ invNav = {brand:null, model:null}; STATE.parts.q = ''; resetInvTables(); route(); }
function setInvView(v){ invView = v; invNav = {brand:null, model:null}; resetInvTables(); route(); }

const generalParts = () => db.parts.filter(p => !p.modelIds.some(id => modelById(id)));
const brandModels  = bid => db.models.filter(m => m.brandId === bid).sort((a,b)=>a.name.localeCompare(b.name));
const brandParts   = bid => { const ids = brandModels(bid).map(m => m.id); return db.parts.filter(p => p.modelIds.some(id => ids.includes(id))); };
const modelParts   = mid => db.parts.filter(p => p.modelIds.includes(mid));
const lowIn        = list => list.filter(p => p.stock <= p.reorder).length;
const iconBtn = (cls, onclick, icon, tip) => `<button class="btn ${cls} icon" onclick="${onclick}" data-tip="${tip}" aria-label="${tip}">${ICON[icon]}</button>`;

function renderInventory(){
  // forget a brand or model that no longer exists
  if(invNav.brand && invNav.brand !== GENERAL && !brandById(invNav.brand)) invNav = {brand:null, model:null};
  if(invNav.model && !modelById(invNav.model)) invNav.model = null;
  const lvl = invLevel(), list = invView === 'list';

  // app bar buttons follow the level you are on
  let add;
  if(list || lvl === 'model' || lvl === 'general') add = iconBtn('', `partForm(null, ${invNav.model ? `'${invNav.model}'` : 'null'})`, 'plus', 'Add Part');
  else if(lvl === 'brand') add = iconBtn('', `modelForm(null,'${invNav.brand}')`, 'plus', 'Add Model');
  else add = iconBtn('', 'brandForm()', 'plus', 'Add Brand');

  const units = db.parts.reduce((a,p)=>a+Math.max(p.stock,0),0);
  const value = db.parts.reduce((a,p)=>a+p.cost*Math.max(p.stock,0),0);
  const low = lowIn(db.parts);
  const atTop = list || lvl === 'brands';

  // path: Brands / Toyota / Corolla
  const b = invNav.brand && invNav.brand !== GENERAL ? brandById(invNav.brand) : null;
  const m = invNav.model ? modelById(invNav.model) : null;
  let path;
  if(list) path = '<b>All parts</b>';
  else if(lvl === 'brands') path = '<b>Brands</b>';
  else {
    path = `<a onclick="invHome()">Brands</a><span class="sep">/</span>`;
    if(lvl === 'general') path += '<b>General</b>';
    else if(lvl === 'brand') path += `<b>${esc(b.name)}</b>`;
    else path += `<a onclick="openBrand('${b.id}')">${esc(b.name)}</a><span class="sep">/</span><b>${esc(m.name)}</b>`;
  }

  $('#app').innerHTML = `
    <div class="page-head">${iconBtn('outline','restockForm()','inbox','New Stock Entry')}${add}</div>
    <div class="card inv-nav ${atTop && !list ? 'top' : ''}">
      ${!list && lvl !== 'brands' ? `<button class="btn outline icon" onclick="invBack()" data-tip="Back" aria-label="Back">${ICON.back}</button>` : ''}
      ${atTop && !list ? '' : `<div class="inv-path">${path}</div>`}
      <div class="search">${ICON.search}<input id="q_inv" placeholder="Search all parts by name, SKU or category" value="${esc(STATE.parts.q)}"></div>
      <div class="seg" role="group" aria-label="View">
        <button class="${!list?'active':''}" onclick="setInvView('browse')" data-tip="Browse by brand" aria-label="Browse by brand">${ICON.grid}</button>
        <button class="${list?'active':''}" onclick="setInvView('list')" data-tip="All parts" aria-label="All parts">${ICON.list}</button>
      </div>
    </div>
    <div id="invBody"></div>`;
  $('#q_inv').oninput = e => { STATE.parts.q = e.target.value; resetInvTables(); renderInvBody(); };
  renderInvBody();
}

function renderInvBody(){
  const lvl = invLevel(), st = STATE.parts, searching = !!st.q.trim();
  if(searching || invView === 'list' || lvl === 'model' || lvl === 'general'){
    let title, sub = '';

          <option value="">All</option>
          <option value="in" ${st.stock==='in'?'selected':''}>In stock</option>
          <option value="low" ${st.stock==='low'?'selected':''}>Low / out of stock</option></select></div>

TABLES.parts = () => ({

function modelOptions(selected, allLabel){
  return `<option value="">${esc(allLabel)}</option>` + db.brands.map(b => {
    const ms = db.models.filter(m => m.brandId === b.id);
    if(!ms.length) return '';
    return `<optgroup label="${esc(b.name)}">${ms.map(m=>`<option value="${m.id}" ${m.id===selected?'selected':''}>${esc(b.name)} ${esc(m.name)}</option>`).join('')}</optgroup>`;
  }).join('');
}
function filterParts(f, list = db.parts){
  const q = (f.q||'').toLowerCase().trim();
  return list.filter(p => {
    if(q && ![p.name,p.sku,p.category].join(' ').toLowerCase().includes(q)) return false;
    if(f.model && !p.modelIds.includes(f.model)) return false;
    if(f.stock === 'low' && p.stock > p.reorder) return false;
    if(f.stock === 'in' && p.stock <= 0) return false;
    return true;
  }).sort((a,b)=>a.name.localeCompare(b.name));
}
// Show up to two vehicles, then "+N"
function fitsCell(p){
  const ms = p.modelIds.map(id => modelById(id)).filter(Boolean);
  if(!ms.length) return '<span class="sub">Not linked</span>';
  return `<span title="${esc(ms.map(modelLabel).join(', '))}">${ms.slice(0,2).map(m=>`<span class="chip">${esc(modelLabel(m))}</span>`).join('')}${ms.length>2?`<span class="chip">+${ms.length-2}</span>`:''}</span>`;
}

function partForm(id, presetModel){
  const p = id ? partById(id) : {sku:'', name:'', category:'', cost:'', price:'', stock:0, reorder:db.settings.defaultReorder, modelIds: presetModel ? [presetModel] : []};
  const checks = db.brands.map(b => {
    const ms = db.models.filter(m => m.brandId === b.id);
    if(!ms.length) return '';
    return `<div class="grp">${esc(b.name)}</div>` + ms.map(m => `<label><input type="checkbox" name="models" value="${m.id}" ${p.modelIds.includes(m.id)?'checked':''}> ${esc(m.name)} ${m.years?`<span class="sub">(${esc(m.years)})</span>`:''}</label>`).join('');

    <form id="f">

        <div class="field"><label>SKU / part number</label><input name="sku" required value="${esc(p.sku)}" placeholder="e.g. OF-1001"></div>
        <div class="field"><label>Category</label><input name="category" value="${esc(p.category)}" list="cats"></div>
        <div class="field"><label>Reorder level</label><input name="reorder" type="number" min="0" step="1" required value="${p.reorder}"></div>
        <div class="field"><label>Cost price (${esc(cur())})</label><input name="cost" type="number" min="0" step="0.01" required value="${p.cost}"></div>
        <div class="field"><label>Selling price (${esc(cur())})</label><input name="price" type="number" min="0" step="0.01" required value="${p.price}"></div>
        <div class="field"><label>${id ? 'Quantity in stock' : 'Opening stock'}</label><input name="stock" type="number" min="0" step="1" required value="${p.stock}"></div>
      </div>
      <datalist id="cats">${[...new Set(db.parts.map(x=>x.category).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
      <div class="field"><label>Compatible vehicle models</label>
        <div class="checks">${checks || '<span class="sub">Add vehicle brands and models first.</span>'}</div></div>
      <div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">Save Part</button></div>
    </form>`);
  $('#f').onsubmit = e => {
    e.preventDefault();
    const f = e.target;
    const data = {
      name:f.name.value.trim(), sku:f.sku.value.trim().toUpperCase(), category:f.category.value.trim(),
      cost:Math.max(0, parseFloat(f.cost.value)||0), price:Math.max(0, parseFloat(f.price.value)||0),
      stock:Math.max(0, parseInt(f.stock.value)||0), reorder:Math.max(0, parseInt(f.reorder.value)||0),
      modelIds:[...f.querySelectorAll('input[name=models]:checked')].map(c=>c.value)
    };
    if(db.parts.some(x => x.sku === data.sku && x.id !== id)) return toast('That SKU is already in use');
    if(id){
      const diff = data.stock - p.stock;
      Object.assign(p, data);
      if(diff) logMovement(p, 'Adjustment', diff, 'Edited stock count');
    } else {
      const np = {id:newId('p'), ...data};
      db.parts.push(np);
      if(np.stock) logMovement(np, 'Opening stock', np.stock);
    }
    save(); closeModal(); toast('Part saved'); route();

}

// Stock entry: called with a part id (Restock) or without (pick the part)
function restockForm(id){
  if(!db.parts.length) return toast('Add a spare part first');
  const parts = db.parts.slice().sort((a,b)=>a.name.localeCompare(b.name));
  const first = id ? partById(id) : parts[0];
  openModal(`<h3>${id ? 'Restock: ' + esc(first.name) : 'New stock entry'}</h3>
    <form id="f">
      ${id ? `<p class="sub" style="margin-top:-6px">Currently ${first.stock} in stock.</p>` : `<div class="field"><label>Part</label>
        <select name="part">${parts.map(p=>`<option value="${p.id}">${esc(p.name)} (${esc(p.sku)}) · ${p.stock} in stock</option>`).join('')}</select></div>`}
      <div class="grid2">
        <div class="field"><label>Quantity received</label><input name="qty" type="number" min="1" step="1" required value="1"></div>
        <div class="field"><label>Unit cost (${esc(cur())})</label><input name="cost" type="number" min="0" step="0.01" required value="${first.cost}"></div>
      </div>
      <div class="field"><label>Supplier (optional)</label><input name="ref"></div>
      <label style="display:flex;gap:8px;align-items:center;color:var(--text);font-weight:400;font-size:13px"><input type="checkbox" name="exp" checked>
        Record this as a stock purchase expense in Accounts</label>
      <div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">Add to Stock</button></div></form>`);
  if(!id) $('#f').part.onchange = e => { $('#f').cost.value = partById(e.target.value).cost; };
  $('#f').onsubmit = e => {
    e.preventDefault();
    const f = e.target, p = id ? first : partById(f.part.value);
    const q = parseInt(f.qty.value)||0; if(q<=0) return;
    const cost = Math.max(0, parseFloat(f.cost.value)||0);
    p.stock += q; p.cost = cost;
    logMovement(p, 'Restock', q, f.ref.value.trim());
    flash([p.id, db.movements[db.movements.length-1].id]);
    if(f.exp.checked && cost > 0){
      db.expenses.push({id:newId('e'), date:todayStr(), description:`Restock ${q} × ${p.name}`, category:'Stock purchase', amount:cost*q, by:currentUser.name});
    }
    save(); closeModal(); toast(`Added ${q} × ${p.name}`); route();
  };
}
function deletePart(id){
  confirmBox(`Delete ${partById(id).name}? Past sales and stock records are kept.`, () => {
    db.parts = db.parts.filter(p => p.id !== id);
    cart = cart.filter(c => c.partId !== id); STATE.parts.sel.delete(id);
    save(); toast('Part deleted');
    if(location.hash === '#part-' + id) go('inventory'); else route();
  });
}
function deleteSelectedParts(){
  const ids = [...STATE.parts.sel].filter(id => partById(id));
  confirmBox(`Delete ${ids.length} selected part(s)? Past sales and stock records are kept.`, () => {
    db.parts = db.parts.filter(p => !ids.includes(p.id));
    cart = cart.filter(c => !ids.includes(c.partId)); STATE.parts.sel.clear();
    save(); toast(`${ids.length} part(s) deleted`); route();
  });
}

/* ---------- Part details page ---------- */
function partSalesRows(id){
  const rows = [];
  db.sales.forEach(s => s.items.forEach((i,n) => { if(i.partId === id) rows.push({key:s.id+'-'+n, s, i}); }));
  return rows.reverse();
}
function renderPartDetails(id){
  const p = partById(id), sales = partSalesRows(id);
  const unitsSold = sales.reduce((a,r)=>a+r.i.qty,0);
  const revenue = sales.reduce((a,r)=>a+r.i.price*r.i.qty,0);
  const profit = sales.reduce((a,r)=>a+(r.i.price-itemCost(r.i))*r.i.qty,0);
  const margin = p.price ? ((p.price - p.cost) / p.price * 100).toFixed(1) : '0.0';
  const vehicles = p.modelIds.map(modelById).filter(Boolean);

  $('#app').innerHTML = `
    <div class="page-head">
      <button class="btn outline icon" onclick="partForm('${id}')" data-tip="Edit Part" aria-label="Edit Part">${ICON.edit}</button>
      <button class="btn  icon" onclick="restockForm('${id}')" data-tip="Restock" aria-label="Restock">${ICON.inbox}</button>
    </div>
    ${summaryCards([
      {title:'In Stock', color:'blue', value:'Total ' + p.stock, period:stockLabel(p)},
      {title:'Units Sold', color:'orange', value:'Total ' + unitsSold, period:'All time'},
      {title:'Profit Earned', color: profit >= 0 ? 'green' : 'loss', value:'Total ' + money(profit), period:'From ' + money(revenue) + ' sales'}
    ])}
    <div class="two-col">
      <div class="card"><div class="card-head"><h3>Part Information</h3></div><div class="card-body">
        <div class="pl-row"><span>SKU</span><span>${esc(p.sku)}</span></div>
        <div class="pl-row"><span>Category</span><span>${esc(p.category || '—')}</span></div>
        <div class="pl-row"><span>Cost price</span><span>${money(p.cost)}</span></div>
        <div class="pl-row"><span>Selling price</span><span>${money(p.price)}</span></div>
        <div class="pl-row"><span>Profit per unit</span><span>${money(p.price - p.cost)} · ${margin}%</span></div>
        <div class="pl-row"><span>Reorder level</span><span>${p.reorder}</span></div>
        <div class="pl-row"><span>Status</span><span>${stockStatus(p)}</span></div>
        <div class="pl-row"><span>Stock value (cost)</span><span>${money(p.cost * Math.max(p.stock,0))}</span></div>
      </div></div>
      <div class="card"><div class="card-head"><h3>Compatible Vehicles</h3><span class="sub">${vehicles.length} model(s)</span></div><div class="card-body">
        ${vehicles.length ? vehicles.map(m => `<div class="pl-row"><span style="color:var(--ink)">${esc(modelLabel(m))}</span><span class="sub">${esc(m.years||'')}</span></div>`).join('')
          : '<div class="empty" style="padding:20px">Not linked to any vehicle yet. Use Edit to add compatible models.</div>'}
      </div></div>
    </div>
    <div class="card"><div class="card-head"><h3>Sales History</h3></div><div style="height:14px"></div>
      <div class="table-wrap" id="tb_partSales"></div><div id="tf_partSales"></div></div>
    <div class="card"><div class="card-head"><h3>Stock History</h3></div><div style="height:14px"></div>
      <div class="table-wrap" id="tb_partStock"></div><div id="tf_partStock"></div></div>`;
  partDetailId = id;
  drawTable('partSales'); drawTable('partStock');
}

/* ---------- Brand & model forms ---------- */
function brandsModal(){
  openModal(`<h3>Brands</h3>
    ${db.brands.length ? `<table>${db.brands.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(b => `<tr>
      <td class="strong">${esc(b.name)}</td><td class="sub">${db.models.filter(m=>m.brandId===b.id).length} model(s)</td>
      <td class="num"><button class="btn outline sm" onclick="brandForm('${b.id}')">Edit</button> <button class="btn danger sm" onclick="deleteBrand('${b.id}')">Delete</button></td></tr>`).join('')}</table>`
      : '<div class="empty">No brands yet.</div>'}
    <div class="modal-actions"><button class="btn outline" onclick="closeModal()">Close</button><button class="btn" onclick="brandForm()">${ICON.plus}Add Brand</button></div>`);
}
function brandForm(id){
  const b = id ? brandById(id) : {name:'', logo:''};
  let logo = b.logo || '';
  const preview = () => logo ? `<img src="${logo}" alt="">` : `<span>${ICON.tag}<br>No logo</span>`;
  openModal(`<h3>${id ? 'Edit' : 'Add'} brand</h3>
    <form id="f">
      <div class="field"><label>Brand name</label><input name="name" required value="${esc(b.name)}" placeholder="e.g. Toyota"></div>
      <div class="field"><label>Logo (optional)</label>
        <div class="logo-upload">
          <div class="brand-logo-prev" id="blPrev">${preview()}</div>
          <div>
            <input type="file" id="blFile" accept="image/*" style="display:none">
            <button type="button" class="btn outline sm" onclick="$('#blFile').click()">Upload logo</button>
            <button type="button" class="btn ghost sm" id="blRemove" ${logo?'':'style="display:none"'}>Remove</button>
            <div class="hint">PNG with a clear background works best. Without a logo, the brand’s initials are shown.</div>
          </div>
        </div></div>
      <div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">Save</button></div></form>`);
  $('#blFile').onchange = e => {
    const file = e.target.files[0]; if(!file) return;
    shrinkImage(file, 160).then(url => { logo = url; $('#blPrev').innerHTML = preview(); $('#blRemove').style.display = ''; })
      .catch(() => toast('Could not read that image'));
  };
  $('#blRemove').onclick = () => { logo = ''; $('#blPrev').innerHTML = preview(); $('#blRemove').style.display = 'none'; };
  $('#f').onsubmit = e => {
    e.preventDefault();
    const name = e.target.name.value.trim();
    if(!name) return;
    if(db.brands.some(x => x.name.toLowerCase() === name.toLowerCase() && x.id !== id)) return toast('That brand already exists');
    if(id) Object.assign(b, {name, logo}); else db.brands.push({id:newId('b'), name, logo});
    save(); closeModal(); toast('Brand saved'); route();
  };
}
function deleteBrand(id){
  const ms = db.models.filter(m => m.brandId === id);
  confirmBox(`Delete ${brandById(id).name}${ms.length ? ' and its ' + ms.length + ' model(s)' : ''}? Parts will stay, but lose these compatibility links.`, () => {
    const ids = ms.map(m => m.id);
    db.parts.forEach(p => p.modelIds = p.modelIds.filter(x => !ids.includes(x)));
    db.models = db.models.filter(m => m.brandId !== id);
    db.brands = db.brands.filter(b => b.id !== id);
    save(); toast('Brand deleted'); route();
  });
}
function modelForm(id, presetBrand){
  if(!db.brands.length) return toast('Add a brand first');
  const m = id ? modelById(id) : {name:'', years:'', brandId: presetBrand || db.brands[0].id};
  openModal(`<h3>${id ? 'Edit' : 'Add'} model</h3>
    <form id="f">
      <div class="field"><label>Brand</label><select name="brandId">${db.brands.map(b=>`<option value="${b.id}" ${b.id===m.brandId?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Model name</label><input name="name" required value="${esc(m.name)}" placeholder="e.g. Corolla"></div>
      <div class="field"><label>Years (optional)</label><input name="years" value="${esc(m.years)}" placeholder="e.g. 2008–2018"></div>
      <div class="modal-actions"><button type="button" class="btn outline" onclick="closeModal()">Cancel</button><button class="btn">Save</button></div>
    </form>`);
  $('#f').onsubmit = e => {
    e.preventDefault();
    const f = e.target, data = {brandId:f.brandId.value, name:f.name.value.trim(), years:f.years.value.trim()};
    if(!data.name) return;
    if(id) Object.assign(m, data); else db.models.push({id:newId('m'), ...data});
    save(); closeModal(); toast('Model saved'); route();
  };
}
function deleteModel(id){
  confirmBox(`Delete ${modelLabel(modelById(id))}? Parts will stay, but lose this compatibility link.`, () => {
    db.parts.forEach(p => p.modelIds = p.modelIds.filter(x => x !== id));
    db.models = db.models.filter(m => m.id !== id);
    save(); toast('Model deleted'); route();
  });
}
function showModelParts(id){
  const m = modelById(id), ps = db.parts.filter(p => p.modelIds.includes(id));
  openModal(`<h3>Parts for ${esc(modelLabel(m))}</h3>
    ${ps.length ? `<table><tr><th>Part</th><th class="num">Price</th><th class="num">Qty</th><th>Status</th></tr>
      ${ps.map(p=>`<tr><td class="strong"><a href="#part-${p.id}" onclick="closeModal()">${esc(p.name)}</a><div class="sub">${esc(p.sku)}</div></td><td class="num">${money(p.price)}</td><td class="num">${p.stock}</td><td>${stockStatus(p)}</td></tr>`).join('')}</table>`
